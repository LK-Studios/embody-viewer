// Phrases whose verb is not their first word. A capture group, when there is one, is the object.
const IDIOMS = [
  [/^(?:lie|lay|bed|settle|curl)\s+(?:myself\s+|ourselves\s+)?(?:down|up)\b(?:\s+(?:to|and)\s+(?:sleep|rest|nap|doze))?/, 'sleep'],
  [/^(?:go|get|head|retire)\s+(?:back\s+)?to\s+(?:sleep|bed)\b/, 'sleep'],
  [/^(?:get|take|grab|catch|have)\s+(?:some\s+|a\s+|a\s+little\s+)?(?:sleep|rest|nap|kip|shut-?eye)\b/, 'sleep'],
  [/^(?:turn\s+in|nod\s+off|drift\s+off|doze\s+off|fall\s+asleep)\b/, 'sleep'],
  [/^get\s+up$/, 'wake'],
  [/^(?:shake|nudge)\s+(.+?)\s+(?:awake|up)$/, 'wake'],
  [/^(?:get|climb|hop|jump|clamber|swing)\s+(?:back\s+)?(?:on|in|into|onto|aboard|up\s+(?:on|into|onto))\b/, 'board'],
  [/^(?:get|climb|hop|jump|step|clamber|swing)\s+(?:off|out|down)\b(?:\s+of\b)?/, 'alight'],
  [/^(?:pull|draw)\s+up\b/, 'halt'],
  [/^set\s+(?:off|out)\b/, 'go'],
  [/^set\s+fire\s+to\b/, 'burn'],
  [/^set\s+(.+?)\s+(?:on\s+fire|alight|ablaze|burning)$/, 'burn'],
  [/^(?:throw|toss|feed|put|drop|cast|hold|set|place|lay)\s+(.+?)\s+(?:in|into|on|onto|to|over)\s+(?:the\s+)?(?:fire|flames?|hearth|brazier|coals|embers|lamp|candle)$/, 'burn'],
  [/^(?:cut|set)\s+(.+?)\s+(?:loose|free)$/, 'free'],
  [/^cut\s+(?:the\s+)?(?:ropes?|bonds?|knots?|cords?|bindings?)\s+(?:on|of|binding|holding|off|from)\b/, 'free'],
  [/^(?:see|attend)\s+to\b/, 'tend'],
  [/^patch\s+up\b/, 'tend'],
  [/^patch\s+(.+?)\s+up$/, 'tend'],
  [/^leave\s+(?:a\s+|my\s+|some\s+|the\s+)?(?:word|message|note)\b/, 'leave_word'],
  [/^fuel\s+(?:it\s+|her\s+|him\s+)?up\b/, 'refuel'],

function splitClauses(text) {
  const quotes = [];
  const keep = (q) => { quotes.push(q.trim()); return ` qq${quotes.length - 1}qq `; };
  // "double" quotes anywhere; 'single' ones only where they open after a space (so the reeve's wound stays a word)
  let s = text.replace(/["“”]([^"“”]*)["“”]?/g, (m, q) => keep(q))
    .replace(/(^|[\s(])['‘]([^'‘’]+?)['’](?=$|[\s.,!?;:)])/g, (m, pre, q) => pre + keep(q));
  const parts = s
    .split(/\s*(?:,\s*(?:and\s+|then\s+)?|;|\.\s+|\band then\b|\bthen\b|\band\b)\s*/i)
    .map((x) => x.trim().replace(/[.!?]+$/, ''))
    .filter(Boolean);
  return { parts, quotes };
}

function parseClause(part, quotes) {
  const qs = [...part.matchAll(/qq(\d+)qq/g)].map((m) => quotes[+m[1]]);
  const quote = qs.length ? qs.join(' ') : null;
  let s = part.replace(/qq\d+qq/g, ' ').toLowerCase().replace(/[^a-z0-9'\s-]/g, ' ').replace(/\s+/g, ' ').trim();
  const sneaky = /\b(slowly|carefully|quietly|silently|stealthily|sneakily|softly|cautiously)\b/.test(s);
  const me = firstName().toLowerCase().replace(/[^a-z]/g, '');
  let subject = false, be = false;
  for (let i = 0; i < 8; i++) {
    const before = s;
    s = s.replace(new RegExp(`^(i'm|i am|we're|we are|i'll|i will|we'll|i|we|let me|let's|lets${me ? '|' + me : ''})\\b\\s*`), (m, w) => {
      subject = true;
      if (/'m|am|'re|are/.test(w)) be = true;
      return '';
    });
    s = s.replace(/^(will|shall|then|also|just|now|finally|again|quickly|slowly|carefully|quietly|calmly|gently|immediately|cautiously|silently|stealthily|sneakily|softly|boldly|go and|going to|gonna|try to|tries to|attempt to|want to|need to|decide to|start to|begin to|to)\s+/, (m, x) => {
      if (x === 'going to' || x === 'gonna') be = false;   // "I'm going to sleep" is a deed, not a state
      return '';
    });
    if (s === before) break;
  }
  if (be && /^going\b/.test(s)) be = false;
  const w = s.split(' ').filter(Boolean);
  let verb = null, rest = s;
  if (!be) {
    for (const [re, v] of IDIOMS) {
      const m = s.match(re);
      if (m) { verb = v; rest = [m[1], s.slice(m[0].length)].filter(Boolean).join(' ').trim(); break; }
    }
  }
  if (!verb) { verb = be ? null : LEMMA[w[0]] || null; rest = verb ? w.slice(1).join(' ') : s; }
  if (!verb && !w.length && quote) verb = 'say';
  // src keeps the writer's case and punctuation, for words that go into the world as written (a code, a note)
  const src = part.replace(/qq\d+qq/g, ' ').replace(/\s+/g, ' ').trim();
  return { verb, rest, quote, sneaky, subject, be, original: s, word: w[0] || '', src };
}

function emoteText(cl) {
  // "I nod slowly" → "*Corin nods slowly*"; "I'm tired" → "*Corin is tired*"
  const w = cl.original.split(' ').filter(Boolean);
  if (!w.length) return null;
  const swap = (t) => t.replace(/\bmy\b/g, 'their').replace(/\bmyself\b/g, 'themself').replace(/\bme\b/g, 'them');
  if (cl.be) return `*${firstName()} is ${swap(w.join(' '))}*`;
  let v = w[0];
  if (/(s|sh|ch|x|z|o)$/.test(v)) v += 'es';
  else if (/[^aeiou]y$/.test(v)) v = v.slice(0, -1) + 'ies';
  else v += 's';
  const tail = swap(w.slice(1).join(' '));
  return `*${firstName()} ${v}${tail ? ' ' + tail : ''}*`;
}

function buildStep(cl, ctx) {
  const { verb, quote, sneaky } = cl;
  const rest = cl.rest.replace(/^(?:(?:up|down|over|out|back|across|around|along|into|in|onto|to|toward|towards|at|on|through|inside|outside|off|from|with)\s+)+/, '')
    .replace(/\s+(?:slowly|carefully|quietly|silently|stealthily|sneakily|softly|cautiously|quickly|gently|calmly|now|again)$/, '').trim();
  const affs = S.state.affordances || [];
  const aff = (v, id) => affs.find((a) => a.verb === v && (a.target ?? null) === (id ?? null));
  const act = (v, ref, params) => {
    const a = aff(v, ref ? ref.id : null);
    const filled = params && Object.keys(params).length;
    const ok = a ? a.ok || (filled && /say what|params/i.test(a.reason || '')) : true;
    return { type: 'act', verb: v, ref, params: filled ? params : null, ok, reason: ok ? null : a.reason };
  };
  const keep = (ref) => { if (ref) { ctx.last = ref; if (ref.kind === 'person') ctx.lastPerson = ref; } return ref; };
  const fail = (msg) => ({ type: 'error', msg });
  const has = (v) => affs.some((a) => a.verb === v && a.target);
  const redo = (v, more) => buildStep({ ...cl, verb: v, ...(more || {}) }, ctx);
  const youRef = () => ({ id: S.youId, name: nm(S.youId), kind: 'person' });
  const here = S.state.here;
  const aboard = has('alight');   // aboard a vehicle, here is the vehicle

  switch (verb) {
    case 'go': case 'creep': case 'crawl': {
      const v = verb === 'go' && sneaky ? 'creep' : verb;
      const exits = S.state.exits || [];
      // aboard, "leave", "go out" or "leave the crawler" is climbing down; "go to the yard" is driving there
      if (aboard && (cl.rest ? /^(?:away|out|off|outside|down|ashore)$/.test(rest) || (isNamed(rest) && scoreRef({ id: here.id, name: here.name, kind: 'here', ent: here }, rest) > 0) : cl.word === 'leave')) return redo('alight', { rest: '' });
      if (/^(away|out|off|outside)?$/.test(rest) && cl.rest && exits.length === 1) return act(v, keep({ kind: 'exit', id: exits[0].to, name: exits[0].name }));
      const ref = keep(resolveRef(rest || 'here', null, ctx));
      if (aboard && has('drive') && isNamed(rest) && (!ref || ref.kind === 'place' || (ref.kind === 'exit' && !aff(v, ref.id)))) return redo('drive', { rest: 'to ' + rest });
      if (!ref) return fail(rest ? `There's no “${rest}” to go to from here.` : 'Where to? Click a spot or someone first.');
      if (ref.kind === 'exit' || ref.kind === 'place') return act(v, ref);
      if (ref.kind === 'held') return fail(`You're holding ${ref.name}.`);
      return { type: 'walk', ref };
    }
    case 'look': {
      const skills = (affs.find((a) => a.verb === 'check')?.params?.skill || '').split(',').map((x) => x.trim()).filter(Boolean);
      const sk = skills.find((x) => wordsOf(rest).includes(x));
      if (sk) { const dc = rest.match(/\b(\d{1,2})\b/); return act('check', null, dc ? { skill: sk, dc: +dc[1] } : { skill: sk }); }
      if (!rest || /^(around|about|round)$/.test(rest)) return { type: 'describe' };
      const ref = keep(resolveRef(rest, null, ctx));
      if (!ref) return fail(`You can't see “${rest}” here.`);
      if (ref.kind === 'exit') return act('watch', ref);
      if (ref.kind === 'place') return fail(`${ref.name} isn't next to here.`);
      if (ref.kind === 'spot') return { type: 'describe' };
      if (aff('read', ref.id)?.ok) return act('read', ref);
      if (aff('study', ref.id)?.ok) return act('study', ref);     // a plan
      if (aff('survey', ref.id)?.ok) return act('survey', ref);   // works under way
      return { type: 'inspect', ref };
    }
    case 'read': {
      const ref = keep(resolveRef(rest, ['thing', 'held'], ctx));
      return ref ? act('read', ref) : fail(`Nothing to read called “${rest}”.`);
    }
    case 'watch': {
      const ref = keep(resolveRef(rest, null, ctx));
      if (!ref) return fail(`You can't see “${rest}” from here.`);
      return ref.kind === 'exit' ? act('watch', ref) : { type: 'inspect', ref };
    }
    case 'drink': {
      const named = rest.replace(/^(?:deep|deeply|up|some|a little)\b\s*/, '').replace(/^(?:water\s+)?(?:from\s+)?/, '').trim();
      let ref = named ? resolveRef(named, ['thing', 'held'], ctx) : null;
      if (named && !ref && !/^water$/.test(named)) return fail(`There's no “${named}” to drink from here.`);
      if (!ref) {
        const here = new Set((S.state.present || []).map((e) => e.id));
        const a = affs.find((x) => x.verb === 'drink' && x.ok && here.has(x.target)) || affs.find((x) => x.verb === 'drink' && x.ok);
        if (a) ref = { id: a.target, name: a.target_name, kind: 'thing' };
      }
      return ref ? act('drink', keep(ref)) : fail('There is nothing to drink from here.');
    }
    case 'fill': {
      let ref = resolveRef(rest.replace(/\s+(?:at|from|in|with)\s+.*$/, ''), ['held'], ctx);
      if (!ref) { const a = affs.find((x) => x.verb === 'fill' && x.ok); if (a) ref = { id: a.target, name: a.target_name, kind: 'held' }; }
      return ref ? act('fill', keep(ref)) : fail('There is nothing to fill here.');
    }
    case 'take': case 'drop': {
      // "take the crawler to the salt road" drives it; "take three shards" takes part of a stack
      const tm = verb === 'take' && cl.rest.match(/^(.*?)\s+\bto\b\s+(.+)$/);
      if (tm && affFor('drive', tm[1], ctx, 'named')) return redo('drive', { rest: cl.rest });
      const phrase = rest.replace(/\s+(?:up|down|away)$/, '').replace(verb === 'take' ? /\s+(?:from|out of|off)\s+.*$/ : /$^/, '');
      const cq = countOf(phrase);
      let ref = resolveRef(cq.rest, verb === 'take' ? ['thing'] : ['held'], ctx);
      if (!ref && verb === 'take') ref = affFor('take', cq.rest, ctx, 'named');   // off a rack, out of a box
      if (!ref) return fail(phrase ? `There's no “${phrase}” to ${verb} here.` : `${verb === 'take' ? 'Take' : 'Drop'} what?`);
      const n = stackCount(ref, cq);
      return act(verb, keep(ref), n != null ? { count: n } : null);
    }
    case 'toggle': case 'search': case 'kill': case 'follow': case 'threaten': case 'challenge': case 'yield': {
      const want = { toggle: ['held', 'thing'], search: ['person'], kill: ['person'], follow: ['person'], threaten: ['person'], challenge: ['person'], yield: ['person'] }[verb];
      const ref = keep(resolveRef(rest.replace(/^(?:on|off)\s+/, ''), want, ctx));
      return ref ? act(verb, ref) : fail(rest ? `There's no “${rest}” to ${verb} here.` : `${verb[0].toUpperCase() + verb.slice(1)} what?`);
    }
    case 'pick': {
      // "pick the lock" is the locks' verb; "pick up the skin", "pick a shard" are taking
      const lockish = /\b(?:locks?|padlock|hasp|tumblers?)\b/.test(rest);
      const ref = !/\bup\b/.test(cl.rest) && affFor('pick', rest, ctx, lockish ? 'loose' : 'named');
      if (ref) return act('pick', keep(ref));
      return lockish ? fail('There is no lock here to pick.') : redo('take');
    }
    case 'attack': {
      const phrase = rest.replace(/\b(?:with|using)\b.*$/, '').trim();
      const ref = keep(resolveRef(phrase, ['person'], ctx));
      if (!ref && isNamed(phrase)) {
        // "strike the crawler" is the vehicles' strike; "cut a block from the rubble" is dressing stone
        const v = affFor('strike', phrase, ctx, 'named');
        if (v) return act('strike', keep(v));
        if (cl.word === 'cut' && /\b(?:stones?|blocks?|rubble)\b/.test(phrase)) return redo('dress');
      }
      if (!ref) return fail(rest ? `There's no “${rest}” to attack here.` : 'Attack whom?');
      return act('attack', ref, sneaky || /\bslow\b/.test(rest) ? { slow: true } : null);
    }
    case 'brace': case 'stay':
      return act(verb, null);
    case 'give': case 'show': {
      let itemP = rest, whoP = '';
      const m = rest.match(/^(.*?)\s+\bto\b\s+(.+)$/);
      if (m) { itemP = m[1]; whoP = m[2]; }
      else {
        const lead = leadingRef(rest, ['person'], ctx);
        if (lead.ref && lead.rest && resolveRef(countOf(lead.rest).rest, ['held'], ctx)) { whoP = rest.slice(0, rest.length - lead.rest.length).trim(); itemP = lead.rest; }
      }
      const cq = verb === 'give' ? countOf(itemP) : { n: null, rest: itemP };
      const item = resolveRef(cq.rest, ['held'], ctx);
      const who = keep(resolveRef(whoP || 'them', ['person'], ctx));
      if (!item) return fail(`You aren't holding “${cq.rest}”.`);
      if (!who) return fail(`${verb === 'give' ? 'Give' : 'Show'} it to whom? Click someone or name them.`);
      const n = stackCount(item, cq);
      return act(verb, who, n != null ? { item: item.id, count: n } : { item: item.id });
    }
    case 'put': {
      // "put the shards in the strongbox"; "put the blade down" is dropping it; "put the letter in the fire", burning
      const m = rest.match(/^(.*?)\s+\b(?:back\s+)?(?:in|into|inside|on|onto|upon|atop|under|beneath)\s+(.+)$/);
      if (!m) return redo('drop');
      if (/^(?:the\s+)?(?:fire|flames?|hearth|brazier|coals|embers)$/.test(m[2])) return redo('burn', { rest: m[1] });
      const cq = countOf(m[1]);
      const item = resolveRef(cq.rest, ['held'], ctx);
      if (!item) return fail(`You aren't holding “${cq.rest}”.`);
      const holder = affFor('put', m[2], ctx, 'named') || resolveRef(m[2], ['thing'], ctx);
      if (!holder) return fail(`There's no “${m[2]}” here to put it in.`);
      const n = stackCount(item, cq);
      return act('put', keep(holder), n != null ? { item: item.id, count: n } : { item: item.id });
    }
    case 'lay':
      // "lay stone" / "lay the first course" is a mason's work on the wall; "lay the blade on the rack" is putting
      if (/\b(?:stones?|course|courses|wall|blocks?|bricks?|foundations?|footing)\b/.test(rest) && has('work')) return redo('work', { rest: 'as mason' });
      return redo('put');

    // ---- rest and hurt
    case 'sleep':
      return act('sleep', null);
    case 'wake': {
      const phrase = rest.replace(/\s+up$/, '').trim();
      if (!phrase || /^(?:myself|me|self|up)$/.test(phrase)) return act('wake', aff('wake', S.youId) ? youRef() : null);
      const ref = keep(resolveRef(phrase, ['person'], ctx));
      return ref ? act('wake', ref) : fail(`There's no “${phrase}” here to wake.`);
    }
    case 'tend': {
      // "tend to the reeve's wound", "bind my wounds", "patch Ruhl up"
      const phrase = rest.replace(/(?:'s)?\s*\b(?:wounds?|injur(?:y|ies)|hurts?|cuts?|gash(?:es)?|bleeding|burns?)\b.*$/, '').replace(/\s+up$/, '').trim();
      if (/^(?:my|myself|me|my own|own)$/.test(phrase) || (!phrase && /\bmy\b/.test(rest))) return act('tend', youRef());
      const ref = keep(resolveRef(phrase || 'them', ['person'], ctx));
      return ref ? act('tend', ref) : fail(phrase ? `There's no “${phrase}” here to tend.` : 'Tend whom? Click someone or name them.');
    }

    // ---- paper, fire, water, rope
    case 'burn': {
      const phrase = rest.replace(/\s+(?:in|into|on|at|with|over)\s+(?:the\s+)?(?:fire|flames?|hearth|brazier|coals|embers|lamp|candle)\b.*$/, '').trim();
      const ref = affFor('burn', phrase, ctx, 'named') || (isNamed(phrase) ? resolveRef(phrase, ['held', 'thing'], ctx) : null);
      return ref ? act('burn', keep(ref)) : fail(phrase ? `There's no “${phrase}” here to burn.` : 'Burn what?');
    }
    case 'write': case 'sign': {
      // the words: quoted, else everything up to "on the leaf"; signing is writing your own name
      let text = verb === 'sign' ? nm(S.youId) : quote, tgt = rest;
      if (!text) {
        const m = rest.match(/^(.*)\s+(?:on|onto|in|into|across)\s+(.+)$/);
        if (m && affFor('write', m[2], ctx, 'named')) { text = m[1]; tgt = m[2]; } else { text = rest; tgt = ''; }
        const i = cl.src.toLowerCase().lastIndexOf(text);
        if (text && i >= 0) text = cl.src.slice(i, i + text.length);   // as typed, capitals and all
      }
      if (!text) return fail('Write what? e.g. write "meet me at the well" on the leaf');
      let ref = affFor('write', tgt, ctx, 'loose');
      if (!ref && !isNamed(tgt)) {
        // two papers in hand: the blank one
        const blank = affs.find((a) => a.verb === 'write' && a.target && (S.state.holding || []).some((h) => h.id === a.target && h.state?.blank));
        if (blank) ref = { id: blank.target, name: blank.target_name || nm(blank.target), kind: 'held' };
      }
      if (!ref) return fail(tgt ? `You have no “${tgt}” to write on.` : 'Write on what? Hold a leaf of paper first.');
      return act('write', keep(ref), { text });
    }
    case 'consult': {
      const m = rest.match(/^(.*?)\s*\b(?:about|on|regarding|concerning|over|re|for|with)\s+(.+)$/);
      const whoP = m ? m[1] : rest, topic = (quote || (m ? m[2] : '')).trim();
      const who = (isNamed(whoP) && resolveRef(whoP, ['person'], ctx)) || affFor('consult', whoP, ctx, 'loose');
      if (!who) return fail('Consult whom? A Guild reckoner answers for a shard.');
      if (!topic) return fail('Consult them about what? A reckoner sells answers on water, the moon, the convoy or the glass.');
      return act('consult', keep(who), { question: topic });
    }
    case 'free': {
      const phrase = rest.replace(/(?:'s)?\s*\b(?:ropes?|bonds?|knots?|cords?|bindings?)\b/g, ' ').replace(/\s+(?:loose|free|up)$/, '').replace(/\s+/g, ' ').trim();
      const ref = (isNamed(phrase) && resolveRef(phrase, ['person'], ctx)) || affFor('free', phrase, ctx, 'loose');
      return ref ? act('free', keep(ref)) : fail(phrase ? `There's no “${phrase}” here to cut loose.` : 'Free whom?');
    }
    case 'spoil': {
      const phrase = rest.replace(/^(?:the\s+)?seams\s+(?:of|on)\s+/, '').replace(/(?:'s)?\s+seams$/, '').replace(/\s+with\s+.*$/, '').trim();
      const ref = affFor('spoil', phrase, ctx, 'loose') || (isNamed(phrase) ? resolveRef(phrase, ['thing'], ctx) : null);
      return ref ? act('spoil', keep(ref)) : fail(phrase ? `There's no “${phrase}” here to spoil.` : 'Spoil what?');
    }
    case 'leave_word': {
      // "leave word with Ossa for Ruhl: meet me at the well", "leave a message for Sefa with Taan saying …"
      let word = quote, head = rest;
      if (!word) {
        const wm = cl.src.match(/:\s*(.+)$/) || cl.src.match(/\bsaying\s+(.+)$/i) || cl.src.match(/\bthat\s+(.+)$/i);
        if (wm) { word = wm[1].trim(); head = normT(cl.src.slice(0, wm.index)); }
      }
      head = head.replace(/\s+(?:saying|that)$/, '');
      const keeperP = (head.match(/\bwith\s+(.+?)(?=\s+for\b|$)/) || [])[1] || '';
      let forP = (head.match(/\bfor\s+(.+?)(?=\s+with\b|$)/) || [])[1] || '';
      const fi = forP ? cl.src.toLowerCase().indexOf(forP) : -1;
      if (fi >= 0) forP = cl.src.slice(fi, fi + forP.length);   // "Ruhl", as typed
      const keeper = keep(resolveRef(keeperP || 'them', ['person'], ctx));
      if (!keeper) return fail('Leave word with whom? Name someone here who will keep it.');
      if (!word) return fail('Leave what word? e.g. leave word with Ossa for Ruhl: meet me at the well');
      return act('leave_word', keeper, { for: forP || 'anyone', word });
    }

    // ---- locks
    case 'unlock': case 'lock': {
      let code = quote;
      const cm = !code && cl.src.match(/\b(?:code|combination|word|tumblers?(?:\s+to)?|dial(?:\s+to)?)\s+(?:is\s+|of\s+|to\s+)?([A-Za-z0-9-]{2,})/i);
      if (cm) code = cm[1];
      const wm = !code && cl.src.match(/\b(?:with|using)\s+([A-Za-z0-9-]{2,})\s*[.!]?\s*$/i);
      if (wm && !/^(?:key|keys|it|that|this|mine|force)$/i.test(wm[1]) && !resolveRef(wm[1], ['held'], ctx)) code = wm[1];
      const phrase = rest.replace(/\s*\b(?:with|using|by|code|combination)\b.*$/, '').replace(/^open\s+/, '').trim();
      const ref = affFor(verb, phrase, ctx, 'loose');
      if (!ref) return fail(phrase ? `There's no lock on “${phrase}” here.` : `There is nothing here to ${verb}.`);
      return act(verb, keep(ref), code ? { code } : null);
    }
    case 'break': {
      const phrase = rest.replace(/^(?:open|in|down)\s+/, '').replace(/\s+(?:open|in|down)$/, '').trim();
      const ref = affFor('break', phrase, ctx, 'named');
      if (ref) return act('break', keep(ref));
      const v = isNamed(phrase) && affFor('strike', phrase, ctx, 'named');   // "break the crawler"
      if (v) return act('strike', keep(v));
      const lk = affFor('break', phrase, ctx, 'loose');
      return lk ? act('break', keep(lk)) : fail(phrase ? `There's nothing called “${phrase}” here to break.` : 'There is nothing here to break.');
    }

    // ---- vehicles: board from alongside, drive and alight from aboard, halt from either
    case 'board': {
      const ref = affFor('board', rest, ctx, 'named');
      if (ref) return act('board', keep(ref));
      if (isNamed(rest)) {
        const p = resolveRef(rest, null, ctx);   // "get into the hold" is walking
        if (p && (p.kind === 'exit' || p.kind === 'place')) return redo('go');
      }
      if (aboard) return fail(`You are aboard ${here.name} already.`);
      return fail(rest ? `There's no “${rest}” here to board.` : 'There is nothing here to board.');
    }
    case 'alight': {
      const ref = affFor('alight', rest, ctx, 'any');
      if (ref) return act('alight', ref);
      return isNamed(rest) ? redo('go') : fail('You are not aboard anything.');
    }
    case 'ride':
      return redo(aboard || /\bto\b/.test(cl.rest) ? 'drive' : 'board');
    case 'drive': {
      const m = cl.rest.match(/^(.*?)\s*\b(?:to|for|toward|towards|into|on to|back to)\s+(.+)$/);
      const vehP = m ? m[1].replace(/^(?:back|on)\s*/, '') : rest, destP = m ? m[2] : '';
      if (!has('drive')) return fail(has('board') ? 'Board it first: it is driven from aboard.' : 'There is nothing here to drive.');
      const veh = affFor('drive', vehP, ctx, 'any');
      return act('drive', keep(veh), destP ? { to: placeParam(destP) } : null);
    }
    case 'halt': {
      const phrase = isNamed(rest) ? rest : '';
      if (/^following\b/.test(rest) || (!phrase && S.state.you?.state?.follows)) return act('stay', null);
      if (!phrase) {
        const live = affs.find((a) => a.verb === 'halt' && a.ok && a.target);
        return live ? act('halt', keep({ id: live.target, name: live.target_name || nm(live.target), kind: 'thing' })) : act('stay', null);
      }
      const ref = affFor('halt', phrase, ctx, 'named');
      return ref ? act('halt', keep(ref)) : fail(`There's nothing called “${phrase}” on the move here.`);
    }
    case 'repair': {
      // "mend my wounds", "mend Ruhl" are tending
      if (/\b(?:wounds?|injur(?:y|ies)|hurts?|cuts?|myself)\b/.test(rest) || (isNamed(rest) && resolveRef(rest, ['person'], ctx) && !affFor('repair', rest, ctx, 'named'))) return redo('tend');
      const ref = affFor('repair', rest, ctx, 'loose');
      return ref ? act('repair', keep(ref)) : fail('There is nothing broken here to repair.');
    }
    case 'refuel': {
      // "refuel the hauler with pitch", "feed the hauler two pots of pitch", "fuel up"
      let vehP = rest, itemP = '';
      const m = rest.match(/^(.*?)\s*\b(?:with|using)\s+(.+)$/);
      if (m) { vehP = m[1]; itemP = m[2]; }
      else { const lead = leadingAff('refuel', rest, ctx); if (lead) { vehP = rest.slice(0, rest.length - lead.rest.length).trim(); itemP = lead.rest; } }
      const veh = affFor('refuel', vehP, ctx, 'any');
      if (!veh) return fail('There is nothing here that runs on fuel.');
      if (!itemP) return act('refuel', keep(veh));
      const cq = countOf(itemP);
      const item = resolveRef(cq.rest, ['held'], ctx);
      if (!item) return fail(`You aren't holding “${cq.rest}”.`);
      const n = stackCount(item, cq);
      return act('refuel', keep(veh), n != null ? { item: item.id, count: n } : { item: item.id });
    }

    // ---- glass, stone and the wall works
    case 'harvest': {
      const phrase = rest.replace(/^(?:for\s+|up\s+|out\s+)?(?:a\s+|some\s+|one\s+|the\s+)?(?:shards?|glass|emberglass|ember)\b\s*(?:out\s+)?(?:of\s+|from\s+)?/, '').trim();
      const ref = affFor('harvest', phrase, ctx, 'loose');
      return ref ? act('harvest', keep(ref)) : fail('There is no vein here to dig.');
    }
    case 'dress': {
      if (/\b(?:wounds?|injur(?:y|ies)|hurts?|cuts?|gash(?:es)?)\b/.test(rest) || (isNamed(rest) && resolveRef(rest, ['person'], ctx))) return redo('tend');
      const phrase = rest.replace(/^(?:a\s+|some\s+|one\s+|the\s+)?(?:stones?|blocks?)\b\s*(?:out\s+)?(?:of\s+|from\s+)?/, '').trim();
      const ref = affFor('dress', phrase, ctx, 'loose');
      return ref ? act('dress', keep(ref)) : fail('There is no rubble here to dress.');
    }
    case 'work': {
      const rm = rest.match(/\b(?:as|like)\s+(?:a\s+|an\s+|the\s+)?([a-z]+)/);
      const role = rm ? ({ labourer: 'hand', laborer: 'hand', lifter: 'hand', hands: 'hand', masons: 'mason' }[rm[1]] || rm[1]) : null;
      const phrase = rest.replace(/\b(?:as|like)\s+(?:a\s+|an\s+|the\s+)?[a-z]+/, '').replace(/^(?:on|at|in|for)\s+/, '').trim();
      const ref = affFor('work', phrase, ctx, 'loose');
      return ref ? act('work', keep(ref), role ? { role } : null) : fail('There are no works here to work on.');
    }
    case 'supply': {
      // "supply the works with lime", "supply the lime to the works"
      let itemP = rest, worksP = '';
      const mw = rest.match(/^(.*?)\s+\bwith\s+(.+)$/), mt = rest.match(/^(.*?)\s+\b(?:to|into|for)\s+(.+)$/);
      if (mw) { worksP = mw[1]; itemP = mw[2]; } else if (mt) { itemP = mt[1]; worksP = mt[2]; }
      const item = resolveRef(itemP, ['held'], ctx);
      if (!item) return fail(`You aren't holding “${itemP}”.`);
      const ref = affFor('supply', worksP, ctx, 'loose');
      return ref ? act('supply', keep(ref), { item: item.id }) : fail('There are no works here to supply.');
    }
    case 'build': {
      const ref = affFor('build', rest, ctx, 'loose');
      return ref ? act('build', keep(ref)) : fail('There is no plan here to build from.');
    }
    case 'hire': {
      const rm = rest.match(/^(.*?)\s+\b(?:as|for)\s+(?:a\s+|an\s+|the\s+)?([a-z]+)/);
      const who = resolveRef(rm ? rm[1] : rest, ['person'], ctx);
      if (!who) return fail('Hire whom? Name someone here looking for work.');
      const ref = affFor('hire', '', ctx, 'any');
      if (!ref) return fail('There are no works here to hire for.');
      return act('hire', ref, rm ? { who: who.name, role: rm[2] } : { who: who.name });
    }
    case 'smoke': {
      const ref = affFor('smoke', rest.replace(/^out\s+/, '').replace(/\s+out$/, ''), ctx, 'loose');
      return ref ? act('smoke', keep(ref)) : fail('There is nothing here to smoke out.');
    }
    case 'say': {
      const m = rest.match(/^(.*?)\s*\b(?:to|at|towards?)\s+(.+)$/);
      if (quote) {
        const who = (rest && resolveRef(m ? m[2] : rest, ['person'], ctx)) || (S.sel && S.ents.get(S.sel)?.kind === 'person' && !S.ents.get(S.sel).you ? resolveRef('them', ['person'], ctx) : null);
        return { type: 'say', text: quote, to: keep(who) };
      }
      if (!rest) return fail('Say what?');
      const who = m ? resolveRef(m[2], ['person'], ctx) : null;
      return who ? { type: 'say', text: m[1], to: keep(who) } : { type: 'say', text: cl.rest, to: null };
    }
    case 'talk': {
      const lead = leadingRef(rest, ['person'], ctx);
      const who = keep(lead.ref || resolveRef('them', ['person'], ctx));
      if (quote) return { type: 'say', text: quote, to: who };
      if (!who) return fail('Talk to whom? Click someone or name them.');
      const about = lead.rest.replace(/^(?:about|regarding|concerning|re|on|that)\s+/, '').trim();
      return act('talk', who, about ? { about } : null);
    }
    case 'parley': {
      const lead = leadingRef(rest, ['person'], ctx);
      const who = keep(lead.ref || resolveRef('them', ['person'], ctx));
      const offer = quote || lead.rest.replace(/^(?:offering|offer|for|with)\s+/, '').trim();
      if (!who) return fail('Parley with whom?');
      if (!offer) return fail('What do you offer? e.g. “offer Ossa two shards for water”.');
      return act('parley', who, { offer });
    }
  }
  return null;
}

function interpret(text) {
  const { parts, quotes } = splitClauses(text);
  const clauses = [];
  for (const p of parts) {
    const cl = parseClause(p, quotes);
    const prev = clauses[clauses.length - 1];
    if (!cl.verb && !cl.subject && !cl.quote && prev) {
      // "take the skin and the blade" → the blade inherits take; topics and written words keep going
      if (['talk', 'say', 'parley', 'leave_word', 'write'].includes(prev.verb)) { prev.rest += ' and ' + cl.original; prev.src += ' and ' + cl.src; continue; }
      if (prev.verb) { cl.verb = prev.verb; cl.rest = cl.original; }
    }
    // "lie down and sleep" is one sleep
    if (prev && cl.verb && cl.verb === prev.verb && ['sleep', 'stay', 'brace', 'alight', 'halt'].includes(cl.verb) && !cl.rest && !prev.rest) continue;
    clauses.push(cl);
  }
  return clauses;
}

function stepsFor(clauses) {
  const ctx = { last: null, lastPerson: null };
  return clauses.map((cl) => {
    if (cl.verb) return buildStep(cl, ctx);
    if (cl.subject && cl.original) return { type: 'emote', text: emoteText(cl) };
    return null;
  }).filter(Boolean);
}

// how a param reads in the preview: "Emberglass · ×3", "→ The Gate Yard", "“meet me at the well”"
function paramText(k, v) {
  if (k === 'item') return nm(v);
  if (k === 'slow') return 'slow blade';
  if (k === 'count') return `×${v}`;
  if (k === 'to') return `→ ${v}`;
  if (k === 'text' || k === 'word') return `“${v}”`;
  return `${k} ${v}`;
}

function stepLabel(st) {
  const pt = (p) => Object.entries(p || {}).map(([k, v]) => paramText(k, v)).join(' · ');
  switch (st.type) {
    case 'act': return { v: st.verb, t: st.ref ? st.ref.name : '', p: pt(st.params), ok: st.ok, why: st.reason };
    case 'walk': return { v: 'walk to', t: st.ref.name, p: '(only you see this)', ok: true };
    case 'say': return { v: 'say', t: st.to ? `→ ${st.to.name}` : '', p: `“${st.text}”`, ok: true };
    case 'inspect': return { v: 'look at', t: st.ref.name, ok: true };
    case 'describe': return { v: 'look around', t: '', ok: true };
    case 'emote': return { v: 'emote', t: '', p: `${st.text} (said aloud)`, ok: true };
    default: return { v: '✗', t: st.msg, ok: false, why: st.msg };
  }
}

function planCand(text) {
  const steps = stepsFor(interpret(text));
  if (!steps.length) return null;
  const labels = steps.map(stepLabel);
  const bad = labels.find((l) => !l.ok);
  return { kind: 'plan', steps: labels, raw: steps, ok: !bad, reason: bad ? bad.why : null, fill: null, run: () => runPlan(text) };
}

const waitFor = (cond, ms) => new Promise((resolve) => {
  const t0 = performance.now();
  (function tick() { if (cond() || performance.now() - t0 > ms) resolve(); else setTimeout(tick, 50); })();
});

function walkTo(ref) {
  const you = S.ents.get(S.youId);
  if (!you) return;
  let pt = ref.pt;
  if (!pt) {
    const e = S.ents.get(ref.id) || S.ents.get('exit:' + ref.id);
    if (e) {
      const dx = you.pos[0] - e.pos[0], dz = you.pos[2] - e.pos[2];
      const d = Math.hypot(dx, dz) || 1;
      const stand = e.tk === 'well' ? 1.55 : e.kind === 'exit' ? 1.0 : 0.85;
      pt = [e.pos[0] + (dx / d) * stand, e.pos[2] + (dz / d) * stand];
    }
  }
  if (!pt) return;
  S.youSpot = { x: pt[0], z: pt[1], placeId: S.placeId };
  you.target = [pt[0], 0, pt[1]];
  if (ref.id) S.faceAt.set(S.youId, { id: ref.id, until: performance.now() + 120000 });
  S.activity.set(S.youId, { text: `walking to ${ref.name}`, until: performance.now() + 2500 });
  Story.walk(ref);
}

function describeHere() {
  const st = S.state;
  const who = (st.present || []).filter((e) => !(e.state && e.state.hidden)).map((e) => e.name);
  logLine(`${st.here.name}. ${st.here.state?.description || ''}${who.length ? ` Here: ${who.join(', ')}.` : ''}`, 'narr');
  Story.describe(st);
}

async function inspectRef(ref) {
  S.activity.set(S.youId, { text: `looking at ${ref.name}`, until: performance.now() + 4000 });
  if (ref.id) S.faceAt.set(S.youId, { id: ref.id, until: performance.now() + 15000 });
  // what we already know shows instantly; only ask the server when we know nothing
  const known = [...(S.state.present || []), ...(S.state.holding || [])].find((e) => e.id === ref.id);
  const s = known?.state || {};
  const local = s.description || s.text;
  if (local) { logLine(`${ref.name}: ${local}`, 'narr'); Story.look(ref, local); return true; }
  const out = await api('inspect', { entity: ref.id });
  const r = out?.result || {};
  const d = r.state?.description || r.state?.text || reasonOf(out) || 'There was nothing more to it than that.';
  logLine(`${ref.name}: ${d}`, 'narr');
  Story.look(ref, d);
  return true;
}

async function runStep(st) {
  switch (st.type) {
    case 'error': toast(st.msg); logLine(st.msg, 'fail'); return false;
    case 'walk': walkTo(st.ref); return true;
    case 'say': return doSay(st.text, st.to ? st.to.id : undefined);
    case 'emote': return doSay(st.text);
    case 'describe': describeHere(); return true;
    case 'inspect': return inspectRef(st.ref);
    case 'act': {
      if (!st.ok && st.reason) { toast(st.reason); logLine(`${st.verb} ${st.ref ? st.ref.name : ''}: ${st.reason}`, 'fail'); return false; }
      if (st.ref && st.ref.id && st.ref.id !== S.youId && st.verb !== 'go' && st.verb !== 'creep') S.faceAt.set(S.youId, { id: st.ref.id, until: performance.now() + 15000 });
      const before = S.placeId;
      const r = await doVerb(st.verb, st.ref ? st.ref.id : null, st.params);
      if (!r) return false;
      // boarding and alighting change the place too (aboard, the vehicle is the place)
      if (['go', 'creep', 'crawl', 'board', 'alight'].includes(st.verb)) {
        await waitFor(() => S.placeId !== before && !S.pendingPlace, 4000 + ((r.duration || 0) / (S.rate || 1)) * 1000);
      }
      // "drive to the yard and get off": the next step waits until it has pulled in (or stopped short)
      if (st.verb === 'drive') {
        const rolling = () => !!S.state?.here?.state?.moving;
        await waitFor(rolling, 4000);
        const tr = S.state?.here?.state?.trip;
        const secs = tr && tr.eta != null && S.state.t != null ? (tr.eta - S.state.t) / (S.rate || 1) : 300;
        await waitFor(() => !rolling(), Math.min(600000, Math.max(5000, secs * 1000 + 15000)));
      }
      return true;
    }
  }
  return true;
}

// Steps are rebuilt just before they run, so "go to the yard and talk to Ruhl"
// finds Ruhl in the yard after arriving.
async function runPlan(text) {
  const clauses = interpret(text);
  const ctx = { last: null, lastPerson: null };
  for (const cl of clauses) {
    const st = cl.verb ? buildStep(cl, ctx) : cl.subject && cl.original ? { type: 'emote', text: emoteText(cl) } : null;
    if (!st) continue;
    if (!(await runStep(st))) break;
  }
}

// =====================================================================
//  Command bar: suggestions, history, Enter to act
// =====================================================================
const cmd = $('#sayInput');
const sugEl = $('#suggest');
let sugs = [], sugIdx = 0, sugNav = false, histIdx = -1;
let hist = [];
try { hist = JSON.parse(localStorage.getItem('embody.hist') || '[]'); } catch { hist = []; }

const selectedPersonId = () => { const t = S.sel && S.ents.get(S.sel); return t && t.kind === 'person' && !t.you ? t.id : null; };
const shortName = (n) => wordsOf(n).filter((w) => !STOP.has(w)).slice(0, 2).join(' ');

function sayCand(text, to) {
  const toE = to ? S.ents.get(to) : null;
  return { kind: 'say', verb: 'say', target: toE ? `→ ${toE.name}` : '', extra: `“${text}”`, ok: true, fill: null, run: () => doSay(text, to || undefined) };
}

// params a verb does fine without: never prompted for
const OPTIONAL_PARAMS = ['slow', 'dc', 'skill', 'count'];
const OPTIONAL_BY_VERB = { refuel: ['item'], unlock: ['code'], lock: ['code'] };
function actCand(a, params) {
  const pr = {};
  for (const k of Object.keys(a.params || {})) if (params[k] != null) pr[k] = params[k];
  if (params.count != null) pr.count = params.count;   // stacks take a count whether or not the verb declares one
  const missingNeeded = !a.ok && /say what|params/i.test(a.reason || '');
  const filled = Object.keys(pr).length > 0;
  const ok = a.ok || (missingNeeded && filled);
  const tname = a.target ? a.target_name || nm(a.target) : '';
  const freeKeys = Object.keys(a.params || {}).filter((k) => !OPTIONAL_PARAMS.includes(k) && !(OPTIONAL_BY_VERB[a.verb] || []).includes(k));
  const missing = freeKeys.filter((k) => pr[k] == null);
  if (missing.length && (a.ok || missingNeeded)) {
    const k0 = missing[0];
    const fill = (k0 === 'item' ? `${a.verb} ` : `${a.verb} ${shortName(tname)} ${k0} `).replace(/\s+/g, ' ');
    return { kind: 'complete', verb: a.verb, target: tname, extra: `${k0} …`, ok: true, fill, run: null };
  }
  const shown = Object.entries(pr).map(([k, v]) => paramText(k, v)).join(' · ');
  return {
    kind: 'act', verb: a.verb, target: tname, extra: shown, ok, reason: ok ? null : a.reason,
    fill: `${a.verb} ${shortName(tname)}`.trim() + ' ',
    run: () => doVerb(a.verb, a.target, filled ? pr : null),
  };
}

function rawCand(vw, rest) {
  let target = null, tname = rest;
  if (rest) {
    let bs = 0;
    for (const c of refCandidates()) { const sc = nameScore(c.name, rest); if (sc > bs) { bs = sc; target = c.id; tname = c.name; } }
    if (!target) target = rest;
  }
  return { kind: 'raw', verb: vw, target: rest ? tname : '', extra: 'try it anyway', ok: true, fill: null, run: () => doVerb(vw, target, null) };
}

const IDEA_ORDER = ['go', 'alight', 'drive', 'board', 'talk', 'drink', 'fill', 'tend', 'wake', 'read', 'watch', 'give', 'show', 'follow', 'check', 'brace', 'parley', 'creep', 'take', 'toggle'];
function ideas() {
  const seen = new Set(), out = [];
  // drive only ever wants its "to": offer it aboard as a Tab completion
  const affs = (S.state.affordances || []).filter((a) => (a.ok || (a.verb === 'drive' && /params/i.test(a.reason || ''))) && IDEA_ORDER.includes(a.verb));
  affs.sort((a, b) => IDEA_ORDER.indexOf(a.verb) - IDEA_ORDER.indexOf(b.verb));
  for (const a of affs) {
    const key = a.verb + a.target;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(actCand(a, {}));
    if (out.length >= 6) break;
  }
  return out;
}

// Verb-first commands: "go yard", "drink cistern", "talk ossa about water"
function strictSuggestions(text) {
  const affsAll = S.state.affordances || [];
  const m = text.match(/^(\S+)\s*(.*)$/);
  const vw = m[1].toLowerCase(), rest = m[2];
  if (vw === 'say') return [];
  const verbs = [...new Set(affsAll.map((a) => a.verb))];
  const exact = verbs.includes(vw) ? vw : null;
  const prefix = verbs.filter((v) => v.startsWith(vw));
  const verb = exact || (rest && prefix.length === 1 ? prefix[0] : null);
  if (!verb) {
    const out = [];
    if (!rest) for (const v of prefix) {
      const n = affsAll.filter((a) => a.verb === v && a.ok).length;
      out.push({ kind: 'complete', verb: v, target: '', extra: n ? `${n} option${n > 1 ? 's' : ''}` : 'not possible now', ok: true, fill: v + ' ', run: null });
    }
    const speechy = /[.!?,]$/.test(text) || wordsOf(text).length >= 4;
    const say = sayCand(text, selectedPersonId());
    const raw = rawCand(vw, rest);
    return speechy ? [...out, say, raw] : [...out, raw, say];
  }
  const affs = affsAll.filter((a) => a.verb === verb);
  const keys = new Set(affs.flatMap((a) => Object.keys(a.params || {})));
  const params = {};
  let p = rest, colon = null;
  const ci = p.indexOf(':');
  if (ci >= 0) { colon = p.slice(ci + 1).trim(); p = p.slice(0, ci).trim(); }
  let itemPhrase = null;
  if (keys.has('item')) {
    // "give blade to ossa", "put shards in strongbox", "refuel hauler with pitch" (refuel's item is optional)
    const mw = p.match(/^(.*?)\s+(?:with|using)\s+(.+)$/i);
    const mi = p.match(/^(.*?)\s+(?:to|for|at|in|into|on|onto|inside)\s+(.+)$/i);
    if (mw && verb !== 'give' && verb !== 'show') { itemPhrase = mw[2]; p = mw[1]; }
    else if (mi && verb !== 'refuel') { itemPhrase = mi[1]; p = mi[2]; } else if (p && verb !== 'refuel') { itemPhrase = p; p = ''; }
    if (itemPhrase) { const cq = countOf(itemPhrase); if (cq.n != null && !cq.soft) params.count = cq.n; itemPhrase = cq.rest; }
  } else if (verb === 'take' || verb === 'drop') {
    const cq = countOf(p);
    if (cq.n != null && !cq.soft) { params.count = cq.n; p = cq.rest; }
  }
  if (keys.has('slow') && /\bslow(ly)?\b/i.test(p)) { params.slow = true; p = p.replace(/\bslow(ly)?\b/gi, ' ').trim(); }
  if (keys.has('dc')) { const md = p.match(/\b(?:dc\s*)?(\d{1,2})\b/i); if (md) { params.dc = +md[1]; p = (p.slice(0, md.index) + p.slice(md.index + md[0].length)).trim(); } }
  if (keys.has('skill')) {
    const sk = affs.map((a) => a.params?.skill).find(Boolean);
    const list = sk ? String(sk).split(',').map((x) => x.trim().toLowerCase()) : [];
    const w = wordsOf(p).find((x) => list.includes(x));
    if (w) { params.skill = w; p = p.replace(new RegExp(`\\b${w}\\b`, 'i'), ' ').trim(); }
  }
  const freeKeys = [...keys].filter((k) => !['item', 'slow', 'dc', 'skill', 'count'].includes(k));
  for (const k of freeKeys) {
    const mk = p.match(new RegExp(`\\b${k}\\b\\s*(.*)$`, 'i'));
    if (mk) { if (mk[1]) params[k] = mk[1].trim(); p = p.slice(0, mk.index).trim(); }
    else if (colon) { params[k] = colon; colon = null; }
  }
  if (itemPhrase) {
    let best = null, bs = 0;
    for (const h of S.state.holding || []) { const sc = scoreRef({ name: h.name, kind: 'held', ent: h }, itemPhrase); if (sc > bs) { bs = sc; best = h; } }
    params.item = best ? best.id : itemPhrase;
  }
  const targeted = affs.filter((a) => a.target);
  const w = p.split(/\s+/).filter(Boolean);
  let chosen = [];
  if (w.length && targeted.length) {
    for (let n = w.length; n >= 1 && !chosen.length; n--) {
      const phrase = w.slice(0, n).join(' ');
      const scored = targeted
        .map((a) => [a, scoreRef(refCandidates().find((c) => c.id === a.target) || { name: a.target_name || nm(a.target) }, phrase)])
        .filter(([, s]) => s > 0)
        .sort((x, y) => y[1] - x[1]);
      if (scored.length) {
        chosen = scored.map(([a]) => a);
        const remainder = w.slice(n).join(' ');
        if (remainder && freeKeys.length && params[freeKeys[0]] == null) params[freeKeys[0]] = remainder;
      }
    }
  } else if (!w.length) {
    const sel = S.sel ?? null;
    const selAff = affs.filter((a) => a.target && a.target === sel);
    const self = affs.filter((a) => !a.target);
    chosen = [...self, ...selAff, ...affs.filter((a) => a.target && !selAff.includes(a))];
    chosen.sort((a, b) => (b.ok - a.ok));
  }
  if (params.to) params.to = placeParam(params.to);   // "drive to the landing" → The Carriers' Landing
  const out = chosen.slice(0, 7).map((a) => actCand(a, params));
  if (w.length && !chosen.length) {
    out.push({ kind: 'none', verb, target: p, extra: '', ok: false, reason: `nothing called “${p}” to ${verb} here`, fill: null, run: null });
    out.push(rawCand(verb, rest));
  }
  return out;
}

function buildSuggestions(raw) {
  if (!S.state) return [];
  const text = raw.trim();
  if (!text) return ideas();
  const me = firstName().toLowerCase().replace(/[^a-z]/g, '');
  const natural = /^(i|i'm|i'll|i am|we|let me|let's)\b/i.test(text) || /["“”]/.test(text) || /\b(and|then)\b|,/.test(text) ||
    (me && new RegExp(`^${me}\\b`, 'i').test(text)) || /^say\b/i.test(text);
  const plan = planCand(text);
  const strict = /^say\b/i.test(text) ? [] : strictSuggestions(text);
  if (!plan) return strict;
  if (natural) {
    const lone = plan.raw.length === 1 && plan.raw[0].type === 'say';
    const speakIt = lone || /^say\b/i.test(text) ? [] : [sayCand(text.replace(/^["“]|["”]$/g, ''), selectedPersonId())];
    return [plan, ...speakIt];
  }
  const strong = strict[0] && (strict[0].kind === 'act' || strict[0].kind === 'complete');
  if (strong) return plan.raw.length === 1 && plan.raw[0].type === 'act' ? strict : [...strict.slice(0, 6), plan];
  return [plan, ...strict];
}

function renderSuggest() {
  const open = sugs.length && document.activeElement === cmd;
  sugEl.classList.toggle('open', !!open);
  if (open) {
    sugEl.innerHTML = sugs.map((s, i) => {
      const on = i === sugIdx;
      const right = s.ok ? (s.kind === 'complete' ? 'Tab ↹' : on ? '↵' : '') : s.kind === 'plan' ? 'can’t' : s.reason || '';
      const body = s.kind === 'plan'
        ? `<span class="steps">${s.steps.map((l) => `<span class="v">${esc(l.v)}</span>${l.t ? ` <span class="t">${esc(l.t)}</span>` : ''}${l.p ? ` <span class="p">${esc(l.p)}</span>` : ''}`).join('<span class="sep"> › </span>')}</span>`
        : `<span class="v">${esc(s.verb)}</span>${s.target ? `<span class="t">${esc(s.target)}</span>` : ''}${s.extra ? `<span class="p">${esc(s.extra)}</span>` : ''}`;
      return `<div class="sg ${s.kind} ${on ? 'on' : ''} ${s.ok ? '' : 'no'}" data-i="${i}">${body}<span class="r">${esc(right)}</span></div>`;
    }).join('');
  }
  renderSayTo();
}
function updateSuggest() { sugs = buildSuggestions(cmd.value); sugIdx = 0; renderSuggest(); }
function refreshSuggest() { const keep = sugIdx; sugs = buildSuggestions(cmd.value); sugIdx = Math.max(0, Math.min(keep, sugs.length - 1)); renderSuggest(); }

cmd.addEventListener('focus', updateSuggest);
cmd.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== cmd) { sugEl.classList.remove('open'); renderSayTo(); } }, 120));
cmd.addEventListener('input', () => { histIdx = -1; sugNav = false; updateSuggest(); });
cmd.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowDown') {
    ev.preventDefault();
    if (!sugs.length) { sugs = buildSuggestions(cmd.value); sugIdx = 0; sugNav = true; renderSuggest(); }
    else { sugIdx = (sugIdx + 1) % sugs.length; sugNav = true; renderSuggest(); }
  } else if (ev.key === 'ArrowUp') {
    ev.preventDefault();
    if ((!cmd.value || histIdx >= 0) && hist.length && !sugNav) {
      histIdx = Math.min(hist.length - 1, histIdx + 1);
      cmd.value = hist[hist.length - 1 - histIdx];
      updateSuggest();
    } else if (sugs.length) { sugIdx = (sugIdx - 1 + sugs.length) % sugs.length; sugNav = true; renderSuggest(); }
  } else if (ev.key === 'Tab') {
    ev.preventDefault();
    const s = sugs[sugIdx];
    if (s && s.fill) { cmd.value = s.fill; updateSuggest(); }
  }
});
sugEl.addEventListener('mousedown', (ev) => ev.preventDefault());
sugEl.addEventListener('click', (ev) => {
  const row = ev.target.closest('.sg');
  if (!row) return;
  const s = sugs[+row.dataset.i];
  if (s.kind === 'complete') { cmd.value = s.fill; updateSuggest(); cmd.focus(); }
  else runSuggestion(s, cmd.value.trim());
});

$('#sayForm').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const text = cmd.value.trim();
  if (!text && !sugNav) return;
  if (text) { const keep = sugIdx; sugs = buildSuggestions(text); sugIdx = Math.min(keep, sugs.length - 1); }
  const s = sugs[Math.max(0, sugIdx)];
  if (!s) return;
  if (s.kind === 'complete') { cmd.value = s.fill; updateSuggest(); return; }
  runSuggestion(s, text);
});

function runSuggestion(s, text) {
  if (text) {
    hist = hist.filter((h) => h !== text);
    hist.push(text);
    if (hist.length > 80) hist.shift();
    try { localStorage.setItem('embody.hist', JSON.stringify(hist)); } catch { /* storage may be blocked */ }
  }
  histIdx = -1;
  sugNav = false;
  cmd.value = '';
  if (!s.ok) {
    const why = s.reason || 'Not possible right now';
    toast(why);
    logLine(`${text || s.verb}: ${why}`, 'fail');
  } else if (s.run) {
    s.run();
  }
  // keep the scene clear after acting; ↓ brings the ideas back
  sugs = [];
  sugIdx = 0;
  renderSuggest();
}

function applyState(st, meta) {
  if (!st?.you || !st?.here) return;
  S.state = st;
  S.youId = st.you.id;
  if (st.clock?.rate) S.rate = st.clock.rate;
  learnNames(st);
  S.lat.pushAt = performance.now();
  if (S.placeId !== st.here.id) {
    if (S.placeId == null) { S.placeId = st.here.id; buildPlace(st); S.fade = 1; S.fadeDir = -1; }
    else { S.pendingPlace = st; S.fadeDir = 1; S.sel = null; }
  } else if (!S.pendingPlace) {
    layoutEntities(st, false);
  } else {
    S.pendingPlace = st;
  }
  setAmbient(st.ambient);
  if (st.events?.length) ingestEvents(st.events, meta?.source || 'state');
  renderHud();
  if (document.activeElement === cmd) refreshSuggest();
  $('#boot').classList.add('gone');
}

function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { S.lat.live = true; };
  es.onerror = () => { S.lat.live = false; };
  es.onmessage = (m) => {
    let msg;
    try { msg = JSON.parse(m.data); } catch { return; }
    if (msg.type === 'state') applyState(msg.state, msg);
    else if (msg.type === 'events') ingestEvents(msg.events, msg.source);
    else if (msg.type === 'error') toast(msg.error);
  };
}

let toastTimer = 0;
function toast(text, ms = 3500) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// =====================================================================
//  Keyboard & toggles
// =====================================================================
function setPalette(p) {
  S.pal = p;
  for (const b of document.querySelectorAll('#palSeg button')) b.classList.toggle('on', b.dataset.pal === p);
  document.body.style.background = PALETTES[p].ink;
}
$('#palSeg').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) setPalette(b.dataset.pal); });
function setNarr(v) {
  Story.setOn(v);
  for (const b of document.querySelectorAll('#narrSeg button')) b.classList.toggle('on', (b.dataset.n === '1') === v);
}
$('#narrSeg').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) setNarr(b.dataset.n === '1'); });

function quickGo(placeId) {
  const affs = (S.state?.affordances || []).filter((a) => a.target === placeId);
  const a = affs.find((x) => x.verb === 'go' && x.ok) || affs.find((x) => x.verb === 'crawl' && x.ok) || affs.find((x) => x.ok);
  if (a) doVerb(a.verb, placeId, null);
  else toast((affs[0] && affs[0].reason) || 'You cannot go that way');
}
function cycleSel(dir) {
  const ids = [...S.ents.values()].filter((e) => !e.you).map((e) => e.id);
  if (!ids.length) return;
  const cur = [...S.ents.values()].findIndex((e) => (e.kind === 'exit' ? e.placeId : e.id) === S.sel);
  const list = [...S.ents.values()].filter((e) => !e.you);
  const idx = list.findIndex((e) => (e.kind === 'exit' ? e.placeId : e.id) === S.sel);
  const next = list[(idx + dir + list.length) % list.length] || list[0];
  selectEnt(next.id, false);
  void cur;
}

addEventListener('keydown', (ev) => {
  const typing = ev.target.matches('input, textarea, select');
  if (typing) {
    if (ev.key === 'Escape') ev.target.blur();
    return;
  }
  const k = ev.key;
  if (k >= '1' && k <= '9') { const x = S.state?.exits?.[+k - 1]; if (x) quickGo(x.to); }
  else if (k === 'Enter' || k === '/') { ev.preventDefault(); $('#sayInput').focus(); }
  else if (k === 'n' || k === 'N') setNarr(!Story.on);
  else if (k === 'a' || k === 'A') setTray(!$('#tray').classList.contains('open'));
  else if (k === 'l' || k === 'L') { logEl.classList.toggle('open'); logEl.scrollTop = logEl.scrollHeight; }
  else if (k === 'p' || k === 'P') setPalette(S.pal === 'neon' ? 'desert' : 'neon');
  else if (k === 'o' || k === 'O') cam.spin = !cam.spin;
  else if (k === 'Tab') { ev.preventDefault(); cycleSel(ev.shiftKey ? -1 : 1); }
  else if (k === 'Escape') { S.sel = null; S.form = null; for (const x of S.ents.values()) x.sel = false; setTray(false); renderForm(); renderSayTo(); }
  else if (k === 'ArrowLeft') cam.yaw -= 0.15;
  else if (k === 'ArrowRight') cam.yaw += 0.15;
  else if (k === 'ArrowUp') cam.pitch = Math.min(1.25, cam.pitch + 0.08);
  else if (k === 'ArrowDown') cam.pitch = Math.max(0.06, cam.pitch - 0.08);
  else if (k === '+' || k === '=') cam.dist = Math.max(5, cam.dist * 0.9);
  else if (k === '-') cam.dist = Math.min(32, cam.dist * 1.1);
});

requestAnimationFrame(frame);
connect();
</script>
</body>
