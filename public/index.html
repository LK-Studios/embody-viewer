function splitClauses(text) {
  const quotes = [];
  let s = text.replace(/["“”]([^"“”]*)["“”]?/g, (m, q) => { quotes.push(q.trim()); return ` qq${quotes.length - 1}qq `; });
  const parts = s
    .split(/\s*(?:,\s*(?:and\s+|then\s+)?|;|\.\s+|\band then\b|\bthen\b|\band\b)\s*/i)
    .map((x) => x.trim().replace(/[.!?]+$/, ''))
    .filter(Boolean);
  return { parts, quotes };
}

function parseClause(part, quotes) {
  const qs = [...part.matchAll(/qq(\d+)qq/g)].map((m) => quotes[+m[1]]);
  const quote = qs.length ? qs.join(' ') : null;
  let s = part.replace(/qq\d+qq/g, ' ').toLowerCase().replace(/[^a-z0-9'\s-]/g, ' ').replace(/\s+/g, ' ').trim();
  const sneaky = /\b(slowly|carefully|quietly|silently|stealthily|sneakily|softly|cautiously)\b/.test(s);
  const me = firstName().toLowerCase().replace(/[^a-z]/g, '');
  let subject = false, be = false;
  for (let i = 0; i < 8; i++) {
    const before = s;
    s = s.replace(new RegExp(`^(i'm|i am|we're|we are|i'll|i will|we'll|i|we|let me|let's|lets${me ? '|' + me : ''})\\b\\s*`), (m, w) => {
      subject = true;
      if (/'m|am|'re|are/.test(w)) be = true;
      return '';
    });
    s = s.replace(/^(will|shall|then|also|just|now|finally|again|quickly|slowly|carefully|quietly|calmly|gently|immediately|cautiously|silently|stealthily|sneakily|softly|boldly|go and|going to|gonna|try to|tries to|attempt to|want to|need to|decide to|start to|begin to|to)\s+/, '');
    if (s === before) break;
  }
  if (be && /^going\b/.test(s)) be = false;
  const w = s.split(' ').filter(Boolean);
  let verb = be ? null : LEMMA[w[0]] || null;
  const rest = verb ? w.slice(1).join(' ') : s;
  if (!verb && !w.length && quote) verb = 'say';
  return { verb, rest, quote, sneaky, subject, be, original: s };
}

function emoteText(cl) {
  // "I nod slowly" → "*Corin nods slowly*"; "I'm tired" → "*Corin is tired*"
  const w = cl.original.split(' ').filter(Boolean);
  if (!w.length) return null;
  const swap = (t) => t.replace(/\bmy\b/g, 'their').replace(/\bmyself\b/g, 'themself').replace(/\bme\b/g, 'them');
  if (cl.be) return `*${firstName()} is ${swap(w.join(' '))}*`;
  let v = w[0];
  if (/(s|sh|ch|x|z|o)$/.test(v)) v += 'es';
  else if (/[^aeiou]y$/.test(v)) v = v.slice(0, -1) + 'ies';
  else v += 's';
  const tail = swap(w.slice(1).join(' '));
  return `*${firstName()} ${v}${tail ? ' ' + tail : ''}*`;
}

function buildStep(cl, ctx) {
  const { verb, quote, sneaky } = cl;
  const rest = cl.rest.replace(/^(?:(?:up|down|over|out|back|across|around|along|into|in|onto|to|toward|towards|at|on|through|inside|outside|off|from|with)\s+)+/, '').trim();
  const affs = S.state.affordances || [];
  const aff = (v, id) => affs.find((a) => a.verb === v && (a.target ?? null) === (id ?? null));
  const act = (v, ref, params) => {
    const a = aff(v, ref ? ref.id : null);
    const filled = params && Object.keys(params).length;
    const ok = a ? a.ok || (filled && /say what|params/i.test(a.reason || '')) : true;
    return { type: 'act', verb: v, ref, params: filled ? params : null, ok, reason: ok ? null : a.reason };
  };
  const keep = (ref) => { if (ref) { ctx.last = ref; if (ref.kind === 'person') ctx.lastPerson = ref; } return ref; };
  const fail = (msg) => ({ type: 'error', msg });

  switch (verb) {
    case 'go': case 'creep': case 'crawl': {
      const v = verb === 'go' && sneaky ? 'creep' : verb;
      const exits = S.state.exits || [];
      if (/^(away|out|off|outside)?$/.test(rest) && cl.rest && exits.length === 1) return act(v, keep({ kind: 'exit', id: exits[0].to, name: exits[0].name }));
      const ref = keep(resolveRef(rest || 'here', null, ctx));
      if (!ref) return fail(rest ? `There's no “${rest}” to go to from here.` : 'Where to? Click a spot or someone first.');
      if (ref.kind === 'exit' || ref.kind === 'place') return act(v, ref);
      if (ref.kind === 'held') return fail(`You're holding ${ref.name}.`);
      return { type: 'walk', ref };
    }
    case 'look': {
      const skills = (affs.find((a) => a.verb === 'check')?.params?.skill || '').split(',').map((x) => x.trim()).filter(Boolean);
      const sk = skills.find((x) => wordsOf(rest).includes(x));
      if (sk) { const dc = rest.match(/\b(\d{1,2})\b/); return act('check', null, dc ? { skill: sk, dc: +dc[1] } : { skill: sk }); }
      if (!rest || /^(around|about|round)$/.test(rest)) return { type: 'describe' };
      const ref = keep(resolveRef(rest, null, ctx));
      if (!ref) return fail(`You can't see “${rest}” here.`);
      if (ref.kind === 'exit') return act('watch', ref);
      if (ref.kind === 'place') return fail(`${ref.name} isn't next to here.`);
      if (ref.kind === 'spot') return { type: 'describe' };
      if (aff('read', ref.id)?.ok) return act('read', ref);
      return { type: 'inspect', ref };
    }
    case 'read': {
      const ref = keep(resolveRef(rest, ['thing', 'held'], ctx));
      return ref ? act('read', ref) : fail(`Nothing to read called “${rest}”.`);
    }
    case 'watch': {
      const ref = keep(resolveRef(rest, null, ctx));
      if (!ref) return fail(`You can't see “${rest}” from here.`);
      return ref.kind === 'exit' ? act('watch', ref) : { type: 'inspect', ref };
    }
    case 'drink': {
      const named = rest.replace(/^(?:deep|deeply|up|some|a little)\b\s*/, '').replace(/^(?:water\s+)?(?:from\s+)?/, '').trim();
      let ref = named ? resolveRef(named, ['thing', 'held'], ctx) : null;
      if (named && !ref && !/^water$/.test(named)) return fail(`There's no “${named}” to drink from here.`);
      if (!ref) {
        const here = new Set((S.state.present || []).map((e) => e.id));
        const a = affs.find((x) => x.verb === 'drink' && x.ok && here.has(x.target)) || affs.find((x) => x.verb === 'drink' && x.ok);
        if (a) ref = { id: a.target, name: a.target_name, kind: 'thing' };
      }
      return ref ? act('drink', keep(ref)) : fail('There is nothing to drink from here.');
    }
    case 'fill': {
      let ref = resolveRef(rest.replace(/\s+(?:at|from|in|with)\s+.*$/, ''), ['held'], ctx);
      if (!ref) { const a = affs.find((x) => x.verb === 'fill' && x.ok); if (a) ref = { id: a.target, name: a.target_name, kind: 'held' }; }
      return ref ? act('fill', keep(ref)) : fail('There is nothing to fill here.');
    }
    case 'take': case 'drop': case 'toggle': case 'search': case 'kill': case 'follow': case 'threaten': case 'challenge': case 'yield': {
      const want = { take: ['thing'], drop: ['held'], toggle: ['held', 'thing'], search: ['person'], kill: ['person'], follow: ['person'], threaten: ['person'], challenge: ['person'], yield: ['person'] }[verb];
      const ref = keep(resolveRef(rest.replace(/^(?:on|off)\s+/, ''), want, ctx));
      return ref ? act(verb, ref) : fail(rest ? `There's no “${rest}” to ${verb} here.` : `${verb[0].toUpperCase() + verb.slice(1)} what?`);
    }
    case 'attack': {
      const ref = keep(resolveRef(rest.replace(/\b(?:with|using)\b.*$/, ''), ['person'], ctx));
      if (!ref) return fail(rest ? `There's no “${rest}” to attack here.` : 'Attack whom?');
      return act('attack', ref, sneaky || /\bslow\b/.test(rest) ? { slow: true } : null);
    }
    case 'brace': case 'stay':
      return act(verb, null);
    case 'give': case 'show': {
      let itemP = rest, whoP = '';
      const m = rest.match(/^(.*?)\s+\bto\b\s+(.+)$/);
      if (m) { itemP = m[1]; whoP = m[2]; }
      else {
        const lead = leadingRef(rest, ['person'], ctx);
        if (lead.ref && lead.rest && resolveRef(lead.rest, ['held'], ctx)) { whoP = rest.slice(0, rest.length - lead.rest.length).trim(); itemP = lead.rest; }
      }
      const item = resolveRef(itemP, ['held'], ctx);
      const who = keep(resolveRef(whoP || 'them', ['person'], ctx));
      if (!item) return fail(`You aren't holding “${itemP}”.`);
      if (!who) return fail(`${verb === 'give' ? 'Give' : 'Show'} it to whom? Click someone or name them.`);
      return act(verb, who, { item: item.id });
    }
    case 'say': {
      const m = rest.match(/^(.*?)\s*\b(?:to|at|towards?)\s+(.+)$/);
      if (quote) {
        const who = (rest && resolveRef(m ? m[2] : rest, ['person'], ctx)) || (S.sel && S.ents.get(S.sel)?.kind === 'person' && !S.ents.get(S.sel).you ? resolveRef('them', ['person'], ctx) : null);
        return { type: 'say', text: quote, to: keep(who) };
      }
      if (!rest) return fail('Say what?');
      const who = m ? resolveRef(m[2], ['person'], ctx) : null;
      return who ? { type: 'say', text: m[1], to: keep(who) } : { type: 'say', text: cl.rest, to: null };
    }
    case 'talk': {
      const lead = leadingRef(rest, ['person'], ctx);
      const who = keep(lead.ref || resolveRef('them', ['person'], ctx));
      if (quote) return { type: 'say', text: quote, to: who };
      if (!who) return fail('Talk to whom? Click someone or name them.');
      const about = lead.rest.replace(/^(?:about|regarding|concerning|re|on|that)\s+/, '').trim();
      return act('talk', who, about ? { about } : null);
    }
    case 'parley': {
      const lead = leadingRef(rest, ['person'], ctx);
      const who = keep(lead.ref || resolveRef('them', ['person'], ctx));
      const offer = quote || lead.rest.replace(/^(?:offering|offer|for|with)\s+/, '').trim();
      if (!who) return fail('Parley with whom?');
      if (!offer) return fail('What do you offer? e.g. “offer Ossa two shards for water”.');
      return act('parley', who, { offer });
    }
  }
  return null;
}

function interpret(text) {
  const { parts, quotes } = splitClauses(text);
  const clauses = [];
  for (const p of parts) {
    const cl = parseClause(p, quotes);
    const prev = clauses[clauses.length - 1];
    if (!cl.verb && !cl.subject && !cl.quote && prev) {
      // "take the skin and the blade" → the blade inherits take; topics keep talking
      if (['talk', 'say', 'parley'].includes(prev.verb)) { prev.rest += ' and ' + cl.original; continue; }
      if (prev.verb) { cl.verb = prev.verb; cl.rest = cl.original; }
    }
    clauses.push(cl);
  }
  return clauses;
}

function stepsFor(clauses) {
  const ctx = { last: null, lastPerson: null };
  return clauses.map((cl) => {
    if (cl.verb) return buildStep(cl, ctx);
    if (cl.subject && cl.original) return { type: 'emote', text: emoteText(cl) };
    return null;
  }).filter(Boolean);
}

function stepLabel(st) {
  const pt = (p) => Object.entries(p || {}).map(([k, v]) => (k === 'item' ? nm(v) : k === 'slow' ? 'slow blade' : `${k} ${v}`)).join(' · ');
  switch (st.type) {
    case 'act': return { v: st.verb, t: st.ref ? st.ref.name : '', p: pt(st.params), ok: st.ok, why: st.reason };
    case 'walk': return { v: 'walk to', t: st.ref.name, p: '(only you see this)', ok: true };
    case 'say': return { v: 'say', t: st.to ? `→ ${st.to.name}` : '', p: `“${st.text}”`, ok: true };
    case 'inspect': return { v: 'look at', t: st.ref.name, ok: true };
    case 'describe': return { v: 'look around', t: '', ok: true };
    case 'emote': return { v: 'emote', t: '', p: `${st.text} (said aloud)`, ok: true };
    default: return { v: '✗', t: st.msg, ok: false, why: st.msg };
  }
}

function planCand(text) {
  const steps = stepsFor(interpret(text));
  if (!steps.length) return null;
  const labels = steps.map(stepLabel);
  const bad = labels.find((l) => !l.ok);
  return { kind: 'plan', steps: labels, raw: steps, ok: !bad, reason: bad ? bad.why : null, fill: null, run: () => runPlan(text) };
}

const waitFor = (cond, ms) => new Promise((resolve) => {
  const t0 = performance.now();
  (function tick() { if (cond() || performance.now() - t0 > ms) resolve(); else setTimeout(tick, 50); })();
});

function walkTo(ref) {
  const you = S.ents.get(S.youId);
  if (!you) return;
  let pt = ref.pt;
  if (!pt) {
    const e = S.ents.get(ref.id) || S.ents.get('exit:' + ref.id);
    if (e) {
      const dx = you.pos[0] - e.pos[0], dz = you.pos[2] - e.pos[2];
      const d = Math.hypot(dx, dz) || 1;
      const stand = e.tk === 'well' ? 1.55 : e.kind === 'exit' ? 1.0 : 0.85;
      pt = [e.pos[0] + (dx / d) * stand, e.pos[2] + (dz / d) * stand];
    }
  }
  if (!pt) return;
  S.youSpot = { x: pt[0], z: pt[1], placeId: S.placeId };
  you.target = [pt[0], 0, pt[1]];
  if (ref.id) S.faceAt.set(S.youId, { id: ref.id, until: performance.now() + 120000 });
  S.activity.set(S.youId, { text: `walking to ${ref.name}`, until: performance.now() + 2500 });
  Story.walk(ref);
}

function describeHere() {
  const st = S.state;
  const who = (st.present || []).filter((e) => !(e.state && e.state.hidden)).map((e) => e.name);
  logLine(`${st.here.name}. ${st.here.state?.description || ''}${who.length ? ` Here: ${who.join(', ')}.` : ''}`, 'narr');
  Story.describe(st);
}

async function inspectRef(ref) {
  S.activity.set(S.youId, { text: `looking at ${ref.name}`, until: performance.now() + 4000 });
  if (ref.id) S.faceAt.set(S.youId, { id: ref.id, until: performance.now() + 15000 });
  // what we already know shows instantly; only ask the server when we know nothing
  const known = [...(S.state.present || []), ...(S.state.holding || [])].find((e) => e.id === ref.id);
  const s = known?.state || {};
  const local = s.description || s.text;
  if (local) { logLine(`${ref.name}: ${local}`, 'narr'); Story.look(ref, local); return true; }
  const out = await api('inspect', { entity: ref.id });
  const r = out?.result || {};
  const d = r.state?.description || r.state?.text || reasonOf(out) || 'There was nothing more to it than that.';
  logLine(`${ref.name}: ${d}`, 'narr');
  Story.look(ref, d);
  return true;
}

async function runStep(st) {
  switch (st.type) {
    case 'error': toast(st.msg); logLine(st.msg, 'fail'); return false;
    case 'walk': walkTo(st.ref); return true;
    case 'say': return doSay(st.text, st.to ? st.to.id : undefined);
    case 'emote': return doSay(st.text);
    case 'describe': describeHere(); return true;
    case 'inspect': return inspectRef(st.ref);
    case 'act': {
      if (!st.ok && st.reason) { toast(st.reason); logLine(`${st.verb} ${st.ref ? st.ref.name : ''}: ${st.reason}`, 'fail'); return false; }
      if (st.ref && st.ref.id && st.verb !== 'go' && st.verb !== 'creep') S.faceAt.set(S.youId, { id: st.ref.id, until: performance.now() + 15000 });
      const before = S.placeId;
      const r = await doVerb(st.verb, st.ref ? st.ref.id : null, st.params);
      if (!r) return false;
      if (['go', 'creep', 'crawl'].includes(st.verb)) {
        await waitFor(() => S.placeId !== before && !S.pendingPlace, 4000 + ((r.duration || 0) / (S.rate || 1)) * 1000);
      }
      return true;
    }
  }
  return true;
}

// Steps are rebuilt just before they run, so "go to the yard and talk to Ruhl"
// finds Ruhl in the yard after arriving.
async function runPlan(text) {
  const clauses = interpret(text);
  const ctx = { last: null, lastPerson: null };
  for (const cl of clauses) {
    const st = cl.verb ? buildStep(cl, ctx) : cl.subject && cl.original ? { type: 'emote', text: emoteText(cl) } : null;
    if (!st) continue;
    if (!(await runStep(st))) break;
  }
}

// =====================================================================
//  Command bar: suggestions, history, Enter to act
// =====================================================================
const cmd = $('#sayInput');
const sugEl = $('#suggest');
let sugs = [], sugIdx = 0, sugNav = false, histIdx = -1;
let hist = [];
try { hist = JSON.parse(localStorage.getItem('embody.hist') || '[]'); } catch { hist = []; }

const selectedPersonId = () => { const t = S.sel && S.ents.get(S.sel); return t && t.kind === 'person' && !t.you ? t.id : null; };
const shortName = (n) => wordsOf(n).filter((w) => !STOP.has(w)).slice(0, 2).join(' ');

function sayCand(text, to) {
  const toE = to ? S.ents.get(to) : null;
  return { kind: 'say', verb: 'say', target: toE ? `→ ${toE.name}` : '', extra: `“${text}”`, ok: true, fill: null, run: () => doSay(text, to || undefined) };
}

function actCand(a, params) {
  const pr = {};
  for (const k of Object.keys(a.params || {})) if (params[k] != null) pr[k] = params[k];
  const missingNeeded = !a.ok && /say what|params/i.test(a.reason || '');
  const filled = Object.keys(pr).length > 0;
  const ok = a.ok || (missingNeeded && filled);
  const tname = a.target ? a.target_name || nm(a.target) : '';
  const freeKeys = Object.keys(a.params || {}).filter((k) => !['slow', 'dc', 'skill'].includes(k));
  const missing = freeKeys.filter((k) => pr[k] == null);
  if (missing.length && (a.ok || missingNeeded)) {
    const k0 = missing[0];
    const fill = (k0 === 'item' ? `${a.verb} ` : `${a.verb} ${shortName(tname)} ${k0} `).replace(/\s+/g, ' ');
    return { kind: 'complete', verb: a.verb, target: tname, extra: `${k0} …`, ok: true, fill, run: null };
  }
  const shown = Object.entries(pr).map(([k, v]) => (k === 'item' ? nm(v) : k === 'slow' ? 'slow blade' : `${k} ${v}`)).join(' · ');
  return {
    kind: 'act', verb: a.verb, target: tname, extra: shown, ok, reason: ok ? null : a.reason,
    fill: `${a.verb} ${shortName(tname)}`.trim() + ' ',
    run: () => doVerb(a.verb, a.target, filled ? pr : null),
  };
}

function rawCand(vw, rest) {
  let target = null, tname = rest;
  if (rest) {
    let bs = 0;
    for (const c of refCandidates()) { const sc = nameScore(c.name, rest); if (sc > bs) { bs = sc; target = c.id; tname = c.name; } }
    if (!target) target = rest;
  }
  return { kind: 'raw', verb: vw, target: rest ? tname : '', extra: 'try it anyway', ok: true, fill: null, run: () => doVerb(vw, target, null) };
}

const IDEA_ORDER = ['go', 'talk', 'drink', 'fill', 'read', 'watch', 'give', 'show', 'follow', 'check', 'brace', 'parley', 'creep', 'take', 'toggle'];
function ideas() {
  const seen = new Set(), out = [];
  const affs = (S.state.affordances || []).filter((a) => a.ok && IDEA_ORDER.includes(a.verb));
  affs.sort((a, b) => IDEA_ORDER.indexOf(a.verb) - IDEA_ORDER.indexOf(b.verb));
  for (const a of affs) {
    const key = a.verb + a.target;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(actCand(a, {}));
    if (out.length >= 6) break;
  }
  return out;
}

// Verb-first commands: "go yard", "drink cistern", "talk ossa about water"
function strictSuggestions(text) {
  const affsAll = S.state.affordances || [];
  const m = text.match(/^(\S+)\s*(.*)$/);
  const vw = m[1].toLowerCase(), rest = m[2];
  if (vw === 'say') return [];
  const verbs = [...new Set(affsAll.map((a) => a.verb))];
  const exact = verbs.includes(vw) ? vw : null;
  const prefix = verbs.filter((v) => v.startsWith(vw));
  const verb = exact || (rest && prefix.length === 1 ? prefix[0] : null);
  if (!verb) {
    const out = [];
    if (!rest) for (const v of prefix) {
      const n = affsAll.filter((a) => a.verb === v && a.ok).length;
      out.push({ kind: 'complete', verb: v, target: '', extra: n ? `${n} option${n > 1 ? 's' : ''}` : 'not possible now', ok: true, fill: v + ' ', run: null });
    }
    const speechy = /[.!?,]$/.test(text) || wordsOf(text).length >= 4;
    const say = sayCand(text, selectedPersonId());
    const raw = rawCand(vw, rest);
    return speechy ? [...out, say, raw] : [...out, raw, say];
  }
  const affs = affsAll.filter((a) => a.verb === verb);
  const keys = new Set(affs.flatMap((a) => Object.keys(a.params || {})));
  const params = {};
  let p = rest, colon = null;
  const ci = p.indexOf(':');
  if (ci >= 0) { colon = p.slice(ci + 1).trim(); p = p.slice(0, ci).trim(); }
  let itemPhrase = null;
  if (keys.has('item')) {
    const mi = p.match(/^(.*?)\s+(?:to|for|at)\s+(.+)$/i);
    if (mi) { itemPhrase = mi[1]; p = mi[2]; } else if (p) { itemPhrase = p; p = ''; }
  }
  if (keys.has('slow') && /\bslow(ly)?\b/i.test(p)) { params.slow = true; p = p.replace(/\bslow(ly)?\b/gi, ' ').trim(); }
  if (keys.has('dc')) { const md = p.match(/\b(?:dc\s*)?(\d{1,2})\b/i); if (md) { params.dc = +md[1]; p = (p.slice(0, md.index) + p.slice(md.index + md[0].length)).trim(); } }
  if (keys.has('skill')) {
    const sk = affs.map((a) => a.params?.skill).find(Boolean);
    const list = sk ? String(sk).split(',').map((x) => x.trim().toLowerCase()) : [];
    const w = wordsOf(p).find((x) => list.includes(x));
    if (w) { params.skill = w; p = p.replace(new RegExp(`\\b${w}\\b`, 'i'), ' ').trim(); }
  }
  const freeKeys = [...keys].filter((k) => !['item', 'slow', 'dc', 'skill'].includes(k));
  for (const k of freeKeys) {
    const mk = p.match(new RegExp(`\\b${k}\\b\\s*(.*)$`, 'i'));
    if (mk) { if (mk[1]) params[k] = mk[1].trim(); p = p.slice(0, mk.index).trim(); }
    else if (colon) { params[k] = colon; colon = null; }
  }
  if (itemPhrase) {
    let best = null, bs = 0;
    for (const h of S.state.holding || []) { const sc = scoreRef({ name: h.name, kind: 'held', ent: h }, itemPhrase); if (sc > bs) { bs = sc; best = h; } }
    params.item = best ? best.id : itemPhrase;
  }
  const targeted = affs.filter((a) => a.target);
  const w = p.split(/\s+/).filter(Boolean);
  let chosen = [];
  if (w.length && targeted.length) {
    for (let n = w.length; n >= 1 && !chosen.length; n--) {
      const phrase = w.slice(0, n).join(' ');
      const scored = targeted
        .map((a) => [a, scoreRef(refCandidates().find((c) => c.id === a.target) || { name: a.target_name || nm(a.target) }, phrase)])
        .filter(([, s]) => s > 0)
        .sort((x, y) => y[1] - x[1]);
      if (scored.length) {
        chosen = scored.map(([a]) => a);
        const remainder = w.slice(n).join(' ');
        if (remainder && freeKeys.length && params[freeKeys[0]] == null) params[freeKeys[0]] = remainder;
      }
    }
  } else if (!w.length) {
    const sel = S.sel ?? null;
    const selAff = affs.filter((a) => a.target && a.target === sel);
    const self = affs.filter((a) => !a.target);
    chosen = [...self, ...selAff, ...affs.filter((a) => a.target && !selAff.includes(a))];
    chosen.sort((a, b) => (b.ok - a.ok));
  }
  const out = chosen.slice(0, 7).map((a) => actCand(a, params));
  if (w.length && !chosen.length) {
    out.push({ kind: 'none', verb, target: p, extra: '', ok: false, reason: `nothing called “${p}” to ${verb} here`, fill: null, run: null });
    out.push(rawCand(verb, rest));
  }
  return out;
}

function buildSuggestions(raw) {
  if (!S.state) return [];
  const text = raw.trim();
  if (!text) return ideas();
  const me = firstName().toLowerCase().replace(/[^a-z]/g, '');
  const natural = /^(i|i'm|i'll|i am|we|let me|let's)\b/i.test(text) || /["“”]/.test(text) || /\b(and|then)\b|,/.test(text) ||
    (me && new RegExp(`^${me}\\b`, 'i').test(text)) || /^say\b/i.test(text);
  const plan = planCand(text);
  const strict = /^say\b/i.test(text) ? [] : strictSuggestions(text);
  if (!plan) return strict;
  if (natural) {
    const lone = plan.raw.length === 1 && plan.raw[0].type === 'say';
    const speakIt = lone || /^say\b/i.test(text) ? [] : [sayCand(text.replace(/^["“]|["”]$/g, ''), selectedPersonId())];
    return [plan, ...speakIt];
  }
  const strong = strict[0] && (strict[0].kind === 'act' || strict[0].kind === 'complete');
  if (strong) return plan.raw.length === 1 && plan.raw[0].type === 'act' ? strict : [...strict.slice(0, 6), plan];
  return [plan, ...strict];
}

function renderSuggest() {
  const open = sugs.length && document.activeElement === cmd;
  sugEl.classList.toggle('open', !!open);
  if (open) {
    sugEl.innerHTML = sugs.map((s, i) => {
      const on = i === sugIdx;
      const right = s.ok ? (s.kind === 'complete' ? 'Tab ↹' : on ? '↵' : '') : s.kind === 'plan' ? 'can’t' : s.reason || '';
      const body = s.kind === 'plan'
        ? `<span class="steps">${s.steps.map((l) => `<span class="v">${esc(l.v)}</span>${l.t ? ` <span class="t">${esc(l.t)}</span>` : ''}${l.p ? ` <span class="p">${esc(l.p)}</span>` : ''}`).join('<span class="sep"> › </span>')}</span>`
        : `<span class="v">${esc(s.verb)}</span>${s.target ? `<span class="t">${esc(s.target)}</span>` : ''}${s.extra ? `<span class="p">${esc(s.extra)}</span>` : ''}`;
      return `<div class="sg ${s.kind} ${on ? 'on' : ''} ${s.ok ? '' : 'no'}" data-i="${i}">${body}<span class="r">${esc(right)}</span></div>`;
    }).join('');
  }
  renderSayTo();
}
function updateSuggest() { sugs = buildSuggestions(cmd.value); sugIdx = 0; renderSuggest(); }
function refreshSuggest() { const keep = sugIdx; sugs = buildSuggestions(cmd.value); sugIdx = Math.max(0, Math.min(keep, sugs.length - 1)); renderSuggest(); }

cmd.addEventListener('focus', updateSuggest);
cmd.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== cmd) { sugEl.classList.remove('open'); renderSayTo(); } }, 120));
cmd.addEventListener('input', () => { histIdx = -1; sugNav = false; updateSuggest(); });
cmd.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowDown') {
    ev.preventDefault();
    if (!sugs.length) { sugs = buildSuggestions(cmd.value); sugIdx = 0; sugNav = true; renderSuggest(); }
    else { sugIdx = (sugIdx + 1) % sugs.length; sugNav = true; renderSuggest(); }
  } else if (ev.key === 'ArrowUp') {
    ev.preventDefault();
    if ((!cmd.value || histIdx >= 0) && hist.length && !sugNav) {
      histIdx = Math.min(hist.length - 1, histIdx + 1);
      cmd.value = hist[hist.length - 1 - histIdx];
      updateSuggest();
    } else if (sugs.length) { sugIdx = (sugIdx - 1 + sugs.length) % sugs.length; sugNav = true; renderSuggest(); }
  } else if (ev.key === 'Tab') {
    ev.preventDefault();
    const s = sugs[sugIdx];
    if (s && s.fill) { cmd.value = s.fill; updateSuggest(); }
  }
});
sugEl.addEventListener('mousedown', (ev) => ev.preventDefault());
sugEl.addEventListener('click', (ev) => {
  const row = ev.target.closest('.sg');
  if (!row) return;
  const s = sugs[+row.dataset.i];
  if (s.kind === 'complete') { cmd.value = s.fill; updateSuggest(); cmd.focus(); }
  else runSuggestion(s, cmd.value.trim());
});

$('#sayForm').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const text = cmd.value.trim();
  if (!text && !sugNav) return;
  if (text) { const keep = sugIdx; sugs = buildSuggestions(text); sugIdx = Math.min(keep, sugs.length - 1); }
  const s = sugs[Math.max(0, sugIdx)];
  if (!s) return;
  if (s.kind === 'complete') { cmd.value = s.fill; updateSuggest(); return; }
  runSuggestion(s, text);
});

function runSuggestion(s, text) {
  if (text) {
    hist = hist.filter((h) => h !== text);
    hist.push(text);
    if (hist.length > 80) hist.shift();
    try { localStorage.setItem('embody.hist', JSON.stringify(hist)); } catch { /* storage may be blocked */ }
  }
  histIdx = -1;
  sugNav = false;
  cmd.value = '';
  if (!s.ok) {
    const why = s.reason || 'Not possible right now';
    toast(why);
    logLine(`${text || s.verb}: ${why}`, 'fail');
  } else if (s.run) {
    s.run();
  }
  // keep the scene clear after acting; ↓ brings the ideas back
  sugs = [];
  sugIdx = 0;
  renderSuggest();
}

function applyState(st, meta) {
  if (!st?.you || !st?.here) return;
  S.state = st;
  S.youId = st.you.id;
  if (st.clock?.rate) S.rate = st.clock.rate;
  learnNames(st);
  S.lat.pushAt = performance.now();
  if (S.placeId !== st.here.id) {
    if (S.placeId == null) { S.placeId = st.here.id; buildPlace(st); S.fade = 1; S.fadeDir = -1; }
    else { S.pendingPlace = st; S.fadeDir = 1; S.sel = null; }
  } else if (!S.pendingPlace) {
    layoutEntities(st, false);
  } else {
    S.pendingPlace = st;
  }
  setAmbient(st.ambient);
  if (st.events?.length) ingestEvents(st.events, meta?.source || 'state');
  renderHud();
  if (document.activeElement === cmd) refreshSuggest();
  $('#boot').classList.add('gone');
}

function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { S.lat.live = true; };
  es.onerror = () => { S.lat.live = false; };
  es.onmessage = (m) => {
    let msg;
    try { msg = JSON.parse(m.data); } catch { return; }
    if (msg.type === 'state') applyState(msg.state, msg);
    else if (msg.type === 'events') ingestEvents(msg.events, msg.source);
    else if (msg.type === 'error') toast(msg.error);
  };
}

let toastTimer = 0;
function toast(text, ms = 3500) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// =====================================================================
//  Keyboard & toggles
// =====================================================================
function setMode(m) {
  S.mode = m;
  for (const b of document.querySelectorAll('#modeSeg button')) b.classList.toggle('on', +b.dataset.mode === m);
}
function setPalette(p) {
  S.pal = p;
  for (const b of document.querySelectorAll('#palSeg button')) b.classList.toggle('on', b.dataset.pal === p);
  document.body.style.background = PALETTES[p].ink;
}
$('#modeSeg').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) setMode(+b.dataset.mode); });
$('#palSeg').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) setPalette(b.dataset.pal); });
function setNarr(v) {
  Story.setOn(v);
  for (const b of document.querySelectorAll('#narrSeg button')) b.classList.toggle('on', (b.dataset.n === '1') === v);
}
$('#narrSeg').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) setNarr(b.dataset.n === '1'); });

function quickGo(placeId) {
  const affs = (S.state?.affordances || []).filter((a) => a.target === placeId);
  const a = affs.find((x) => x.verb === 'go' && x.ok) || affs.find((x) => x.verb === 'crawl' && x.ok) || affs.find((x) => x.ok);
  if (a) doVerb(a.verb, placeId, null);
  else toast((affs[0] && affs[0].reason) || 'You cannot go that way');
}
function cycleSel(dir) {
  const ids = [...S.ents.values()].filter((e) => !e.you).map((e) => e.id);
  if (!ids.length) return;
  const cur = [...S.ents.values()].findIndex((e) => (e.kind === 'exit' ? e.placeId : e.id) === S.sel);
  const list = [...S.ents.values()].filter((e) => !e.you);
  const idx = list.findIndex((e) => (e.kind === 'exit' ? e.placeId : e.id) === S.sel);
  const next = list[(idx + dir + list.length) % list.length] || list[0];
  selectEnt(next.id, false);
  void cur;
}

addEventListener('keydown', (ev) => {
  const typing = ev.target.matches('input, textarea, select');
  if (typing) {
    if (ev.key === 'Escape') ev.target.blur();
    return;
  }
  const k = ev.key;
  if (k >= '1' && k <= '9') { const x = S.state?.exits?.[+k - 1]; if (x) quickGo(x.to); }
  else if (k === 'Enter' || k === '/') { ev.preventDefault(); $('#sayInput').focus(); }
  else if (k === 'n' || k === 'N') setNarr(!Story.on);
  else if (k === 'a' || k === 'A') setTray(!$('#tray').classList.contains('open'));
  else if (k === 'l' || k === 'L') { logEl.classList.toggle('open'); logEl.scrollTop = logEl.scrollHeight; }
  else if (k === 'h' || k === 'H') setMode(1 - S.mode);
  else if (k === 'p' || k === 'P') setPalette(S.pal === 'neon' ? 'desert' : 'neon');
  else if (k === 'o' || k === 'O') cam.spin = !cam.spin;
  else if (k === 'Tab') { ev.preventDefault(); cycleSel(ev.shiftKey ? -1 : 1); }
  else if (k === 'Escape') { S.sel = null; S.form = null; for (const x of S.ents.values()) x.sel = false; setTray(false); renderForm(); renderSayTo(); }
  else if (k === 'ArrowLeft') cam.yaw -= 0.15;
  else if (k === 'ArrowRight') cam.yaw += 0.15;
  else if (k === 'ArrowUp') cam.pitch = Math.min(1.25, cam.pitch + 0.08);
  else if (k === 'ArrowDown') cam.pitch = Math.max(0.06, cam.pitch - 0.08);
  else if (k === '+' || k === '=') cam.dist = Math.max(5, cam.dist * 0.9);
  else if (k === '-') cam.dist = Math.min(32, cam.dist * 1.1);
});

requestAnimationFrame(frame);
connect();
</script>
</body>
