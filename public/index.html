<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embody Viewer</title>
<style>
  :root {
    --pill: rgba(243, 239, 255, 0.86);
    --pill-text: #231a5a;
    --glass: rgba(22, 14, 62, 0.66);
    --glass-line: rgba(255, 255, 255, 0.22);
    --accent: #ff5fc8;
    --hp: #9b6bff;
    --vigor: #f2c230;
    --water: #45b8ec;
    --ui: "Segoe UI Variable Display", "Segoe UI", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120a35; color: #fff; font-family: var(--ui); }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; touch-action: none; }
  #gl.dragging { cursor: grabbing; }
  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  /* ---------- pills */
  .pill {
    background: var(--pill); color: var(--pill-text); border-radius: 999px;
    border: 1.5px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 6px 22px rgba(18, 6, 70, 0.35);
    backdrop-filter: blur(10px) saturate(1.3); -webkit-backdrop-filter: blur(10px) saturate(1.3);
  }
  .dark { background: var(--glass); color: #fff; border-color: var(--glass-line); }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- top HUD */
  #vitals { position: fixed; top: 14px; left: 14px; padding: 9px 18px 10px; display: flex; gap: 18px; align-items: center; }
  #vitals .who { font-weight: 700; font-size: 13px; line-height: 1.15; max-width: 150px; }
  #vitals .who small { display: block; font-weight: 500; opacity: .65; font-size: 11px; }
  .meter { display: grid; gap: 4px; min-width: 74px; }
  .meter .lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .meter .lbl i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
  .meter .lbl b { margin-left: auto; font-weight: 600; opacity: .6; font-size: 11px; font-variant-numeric: tabular-nums; }
  .meter .bar { height: 6px; border-radius: 99px; background: rgba(35, 26, 90, 0.14); overflow: hidden; }
  .meter .bar > span { display: block; height: 100%; border-radius: 99px; transition: width .35s ease; }
  .flags { display: flex; gap: 5px; flex-wrap: wrap; }
  .flag { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: #231a5a; color: #fff; }
  .flag.warn { background: #ff5f7e; }

  #place {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    width: min(560px, calc(100vw - 720px)); min-width: 300px;
    padding: 9px 20px; cursor: pointer; text-align: left;
    background: rgba(255,255,255,.08); color: #fff; border: 2px solid rgba(255,255,255,.85);
  }
  #place .row1 { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #place .row1 svg { flex: none; opacity: .9; }
  #place .crumb { opacity: .6; font-weight: 500; }
  #place .row2 { font-size: 12px; opacity: .78; margin: 2px 0 0 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #place .desc { display: none; font-size: 13px; line-height: 1.45; margin: 8px 4px 4px 30px; opacity: .92; white-space: normal; }
  #place.open { border-radius: 22px; }
  #place.open .desc { display: block; }

  #topright { position: fixed; top: 14px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .seg { display: flex; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--pill-text); }
  .seg button.on { background: #231a5a; color: #fff; }
  #lat { padding: 5px 12px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
  #lat i { width: 8px; height: 8px; border-radius: 50%; background: #ff5f7e; display: inline-block; }
  #lat.live i { background: #3ee08f; box-shadow: 0 0 0 3px rgba(62,224,143,.25); }

  /* ---------- tags in the scene */
  .tag { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; will-change: transform; }
  .tag .chip { pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tag .chip i { width: 8px; height: 8px; border-radius: 50%; background: #6b5cff; display: inline-block; }
  .tag.you .chip i { background: var(--accent); }
  .tag.down .chip i { background: #ff5f7e; }
  .tag.exit .chip i { background: #7dfcff; }
  .tag.thing .chip { font-size: 11px; padding: 2px 9px 2px 6px; opacity: .92; }
  .tag.sel .chip { background: #ffe36a; border-color: #fff; }
  .tag .st { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .55; }
  .tag kbd { font: 700 10px var(--mono); background: #231a5a; color: #fff; border-radius: 5px; padding: 1px 5px; }
  .tag .bubble { max-width: 300px; padding: 7px 13px; border-radius: 16px; font-size: 13px; line-height: 1.35; white-space: normal; text-align: left; }
  .tag .act { font-size: 11px; padding: 2px 9px; border-radius: 99px; background: rgba(22,14,62,.7); color: #fff; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- bottom HUD */
  #bottom { position: fixed; left: 14px; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  #captions { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; min-height: 30px; }
  .cap { pointer-events: auto; display: flex; align-items: center; gap: 7px; padding: 5px 13px 5px 9px; font-size: 12.5px; max-width: 440px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .6s; }
  .cap::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; border: 2px solid currentColor; opacity: .55; }
  .cap.pending::before { border-style: dotted; animation: spin 1s linear infinite; }
  .cap.fail { background: #ffd6de; }
  .cap.old { opacity: .55; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #controls { display: flex; gap: 10px; align-items: center; }
  #controls > * { pointer-events: auto; }
  #actionsBtn { display: flex; align-items: center; gap: 9px; padding: 9px 16px; font-weight: 700; font-size: 14px; }
  .beta { font-size: 10px; font-weight: 700; letter-spacing: .06em; border: 1.5px solid currentColor; border-radius: 99px; padding: 1px 7px; opacity: .85; }
  #cmdWrap { flex: 1; max-width: 720px; margin: 0 auto; position: relative; }
  #sayForm { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 16px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.85); color: #fff; }
  #sayForm .prompt { font: 700 20px/1 var(--mono); opacity: .9; }
  #suggest { position: absolute; left: 12px; right: 12px; bottom: calc(100% + 8px); border-radius: 18px; padding: 6px; display: none; flex-direction: column; gap: 2px; max-height: 46vh; overflow: auto; }
  #suggest.open { display: flex; }
  .sg { display: flex; align-items: baseline; gap: 8px; padding: 7px 12px; border-radius: 12px; font-size: 13.5px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .sg.on { background: rgba(255,255,255,.16); }
  .sg .v { font-weight: 700; color: #ffe36a; }
  .sg.say .v { color: #9fe8ff; }
  .sg.raw .v, .sg.complete .v { color: #ffb3e6; }
  .sg .t { font-weight: 600; }
  .sg .p { opacity: .72; overflow: hidden; text-overflow: ellipsis; }
  .sg .r { margin-left: auto; padding-left: 10px; font-size: 11.5px; opacity: .62; flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
  .sg.no { opacity: .5; }
  .sg.plan { white-space: normal; }
  .sg.plan .steps { line-height: 1.5; }
  .sg .sep { opacity: .45; }

  /* ---------- the narrator's page */
  #narr {
    position: fixed; left: 14px; top: 84px; width: min(440px, calc(100vw - 28px)); max-height: 44vh; overflow: hidden;
    padding: 14px 18px; border-radius: 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
    background: rgba(16, 9, 46, .58); border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font: 15px/1.6 "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; color: #f3eeff;
    opacity: 0; transform: translateY(-6px); transition: opacity .4s, transform .4s; pointer-events: none;
  }
  #narr.show { opacity: 1; transform: none; pointer-events: auto; cursor: pointer; }
  body.tray-open #narr { opacity: 0; pointer-events: none; }
  #narr p { margin: 0; white-space: pre-line; transition: opacity .6s; }
  #narr em { color: #ffd2f0; }
  #narr p.epi { text-align: center; font-style: italic; color: #e6dcff; padding: 2px 8px 10px; border-bottom: 1px solid rgba(255,255,255,.12); }
  #narr p.epi em { color: inherit; }
  #narr .caret { opacity: .75; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #sayForm input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #fff; font: 500 15px var(--ui); }
  #sayForm input::placeholder { color: rgba(255,255,255,.7); }
  #sayTo { font-size: 12px; font-weight: 600; opacity: .8; white-space: nowrap; }
  #sayForm button { border: 0; background: transparent; color: #fff; font-weight: 700; font-size: 15px; padding: 4px 10px; }
  #logBtn { padding: 9px 16px; font-weight: 700; font-size: 14px; }
  #help { position: fixed; right: 16px; top: 170px; font-size: 11px; opacity: .55; text-align: right; line-height: 1.6; pointer-events: none; text-shadow: 0 1px 4px #000; }

  /* ---------- tray */
  #tray { position: fixed; left: 14px; bottom: 112px; width: min(460px, calc(100vw - 28px)); max-height: calc(100vh - 220px); overflow: auto; border-radius: 22px; padding: 14px; display: none; flex-direction: column; gap: 12px; }
  #tray.open { display: flex; }
  #tray h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1.5px solid var(--glass-line); background: rgba(255,255,255,.07); border-radius: 99px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: #fff; }
  .chips button.on { background: #ffe36a; color: #231a5a; border-color: #ffe36a; }
  .chips button small { opacity: .6; font-weight: 500; }
  .verbs { display: flex; flex-wrap: wrap; gap: 6px; }
  .verb { border: 0; background: var(--pill); color: var(--pill-text); border-radius: 99px; padding: 6px 14px; font-weight: 700; font-size: 13px; }
  .verb:hover { background: #fff; }
  .verb[disabled] { opacity: .38; cursor: not-allowed; }
  .verb.form::after { content: " …"; }
  .why { font-size: 11.5px; opacity: .6; margin-top: 6px; line-height: 1.5; }
  #trayForm { display: grid; gap: 8px; padding: 10px; border-radius: 16px; background: rgba(255,255,255,.07); }
  #trayForm[hidden] { display: none; }
  #trayForm .fh { font-weight: 700; font-size: 13px; }
  #trayForm label { display: grid; gap: 4px; font-size: 11.5px; opacity: .9; }
  #trayForm input[type=text], #trayForm input[type=number], #trayForm select { font: 500 14px var(--ui); padding: 7px 12px; border-radius: 12px; border: 1.5px solid var(--glass-line); background: rgba(0,0,0,.25); color: #fff; outline: 0; }
  #trayForm label.cb { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #trayForm .row { display: flex; gap: 8px; }
  .exitrow { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .exitrow kbd { font: 700 11px var(--mono); background: rgba(255,255,255,.15); border-radius: 6px; padding: 2px 6px; }
  .exitrow span { flex: 1; font-weight: 600; }
  .exitrow .verb { padding: 4px 11px; font-size: 12px; }

  /* ---------- log */
  #log { position: fixed; top: 112px; right: 14px; bottom: 112px; width: min(400px, calc(100vw - 28px)); border-radius: 22px; padding: 12px 14px; overflow: auto; display: none; font: 12px/1.5 var(--mono); }
  #log.open { display: block; }
  #log .ev { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.06); overflow-wrap: anywhere; }
  #log .ev .n { opacity: .35; margin-right: 6px; }
  #log .ev.say { color: #fff; }
  #log .ev.act, #log .ev.minor { color: rgba(255,255,255,.5); }
  #log .ev.fight { color: #ff8fa6; }
  #log .ev.water { color: #8fdcff; }
  #log .ev.move { color: #b9f5c9; }
  #log .ev.narr { color: #ffe9a8; }
  #log .ev.fail { color: #ff8fa6; }
  #log .ev .detail { display: block; opacity: .7; margin-left: 14px; }

  #toast { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); padding: 8px 18px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 80vw; text-align: center; }
  #toast.show { opacity: 1; }
  @media (max-width: 1180px) {
    #place { top: 76px; left: 14px; transform: none; width: min(520px, calc(100vw - 28px)); min-width: 0; }
    #place .crumb { display: none; }
    #log { top: 150px; }
    #narr { top: 150px; }
  }
  @media (max-width: 980px) { #help { display: none; } }
  @media (max-width: 640px) {
    #vitals { left: 10px; right: 10px; top: 10px; flex-wrap: wrap; gap: 6px 14px; padding: 8px 14px; border-radius: 22px; }
    #vitals .who { flex-basis: 100%; max-width: none; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    #vitals .who small { display: inline; }
    .meter { min-width: 0; flex: 1; }
    #place { top: 100px; left: 10px; right: 10px; width: auto; padding: 7px 14px; }
    #place .row1 { font-size: 15px; }
    #topright { top: 160px; left: 10px; right: 10px; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; align-items: center; gap: 6px; scrollbar-width: none; }
    #topright > * { flex: none; }
    .seg button { padding: 4px 9px; font-size: 11px; }
    #lat { font-size: 10.5px; padding: 4px 10px; }
    #narr { top: 200px; left: 10px; right: 10px; width: auto; max-height: 28vh; font-size: 14px; padding: 10px 14px; gap: 8px; }
    #narr p:nth-last-child(n+4) { display: none; }
    #log { top: 200px; left: 10px; right: 10px; width: auto; bottom: 150px; }
    #bottom { left: 10px; right: 10px; bottom: 10px; gap: 8px; }
    #controls { flex-wrap: wrap; gap: 8px; }
    #cmdWrap { order: -1; flex-basis: 100%; max-width: none; }
    #actionsBtn, #logBtn { padding: 7px 14px; font-size: 13px; }
    #logBtn { margin-left: auto; }
    #tray { left: 10px; right: 10px; width: auto; bottom: 150px; max-height: calc(100vh - 370px); }
    #sayForm input { font-size: 14px; }
    #sayForm button { padding: 4px 6px; }
    .cap { max-width: 100%; }
    #captions .cap:nth-last-child(n+3) { display: none; }
    .tag .bubble { max-width: 200px; font-size: 12px; }
  }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 600 14px var(--mono); letter-spacing: .1em; color: #cbbff5; pointer-events: none; transition: opacity .4s; }
  #boot.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="tags"></div>

<div id="vitals" class="pill"></div>
<button id="place" class="pill" title="Show the description"></button>
<div id="topright">
  <div class="pill seg" id="modeSeg"><button data-mode="0" class="on">Halftone</button><button data-mode="1">ASCII</button></div>
  <div class="pill seg" id="palSeg"><button data-pal="neon" class="on">Neon</button><button data-pal="desert">Desert</button></div>
  <div class="pill seg" id="narrSeg"><button data-n="1" class="on">Narrator</button><button data-n="0">Off</button></div>
  <div class="pill" id="lat"><i></i><span>connecting…</span></div>
</div>

<div id="tray" class="dark pill">
  <div><h4>Target</h4><div class="chips" id="trayTargets"></div></div>
  <div><h4 id="verbsHead">Actions</h4><div class="verbs" id="trayVerbs"></div><div class="why" id="trayWhy"></div></div>
  <form id="trayForm" hidden></form>
  <div id="trayExitsWrap"><h4>Exits</h4><div id="trayExits"></div></div>
</div>
<div id="log" class="dark pill"></div>

<div id="bottom">
  <div id="captions"></div>
  <div id="controls">
    <button id="actionsBtn" class="pill dark">Actions <span class="beta">BETA</span></button>
    <div id="cmdWrap">
      <div id="suggest" class="pill dark"></div>
      <form id="sayForm" class="pill" autocomplete="off">
        <span class="prompt">›</span>
        <input id="sayInput" placeholder="What do you do?  I walk over to the cistern and drink · say &quot;hello&quot; to them" maxlength="600" spellcheck="false">
        <span id="sayTo"></span>
        <button type="submit">Do</button>
      </form>
    </div>
    <button id="logBtn" class="pill dark">Log</button>
  </div>
</div>
<div id="narr" title="Click to finish the line"></div>
<div id="help">drag to orbit · wheel to zoom · click someone, something or the ground<br>⏎ or / type what you do · 1–9 exits · A actions · L log · N narrator · H halftone/ascii · P palette</div>
<div id="toast" class="pill"></div>
<div id="boot">CONNECTING TO THE WORLD…</div>

<script src="state.js"></script>
<script src="world.js"></script>
<script>
'use strict';
// =====================================================================
//  Tags: names, speech and activity floating over the scene
// =====================================================================
const tagsEl = $('#tags');
const tagEls = new Map();
function removeTag(id) { const el = tagEls.get(id); if (el) { el.remove(); tagEls.delete(id); } }
const spotEl = document.createElement('div');
spotEl.className = 'tag exit';
spotEl.innerHTML = '<div class="chip pill"><i></i>here</div>';
spotEl.style.display = 'none';
tagsEl.appendChild(spotEl);

function tagKey(e) {
  const now = performance.now();
  const sp = S.speech.get(e.id); const ac = S.activity.get(e.id);
  const speech = sp && sp.until > now ? sp.text : '';
  const act = ac && ac.until > now ? ac.text : '';
  let st = '';
  if (e.kind === 'person') {
    const s = e.data?.state || {};
    st = e.you ? 'you' : s.dead ? 'dead' : s.down ? 'down' : s.asleep ? 'asleep' : s.wounded ? 'wounded' : '';
  }
  const sel = e.kind === 'exit' ? S.sel === e.placeId : S.sel === e.id;
  return { key: [e.name, st, speech, act, sel, e.idx].join('|'), speech, act, st, sel };
}

function updateTags() {
  const items = [];
  for (const e of S.ents.values()) {
    let el = tagEls.get(e.id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'tag';
      el.addEventListener('click', (ev) => { ev.stopPropagation(); selectEnt(e.id, true); });
      tagsEl.appendChild(el);
      tagEls.set(e.id, el);
    }
    const k = tagKey(e);
    if (el._key !== k.key) {
      el._key = k.key;
      el.className = `tag ${e.kind}${e.you ? ' you' : ''}${e.down ? ' down' : ''}${k.sel ? ' sel' : ''}`;
      const label = e.kind === 'exit' ? `<kbd>${e.idx}</kbd>→ ${esc(e.name)}` : `${esc(e.name)}${k.st ? ` <span class="st">${esc(k.st)}</span>` : ''}`;
      el.innerHTML =
        (k.speech ? `<div class="bubble pill">“${esc(k.speech)}”</div>` : '') +
        `<div class="chip pill"><i></i>${label}</div>` +
        (k.act ? `<div class="act">› ${esc(k.act)}</div>` : '');
      el._measure = true;
    }
    const y = e.tagH ?? (e.kind === 'person' ? (e.down ? 0.95 : 2.2) : e.kind === 'exit' ? 2.95 : 1.05);
    const p = project([e.pos[0], (e.pos[1] || 0) + y, e.pos[2]], W, H);
    if (!p || p[0] < -200 || p[0] > W + 200 || p[1] < -100 || p[1] > H + 100) { el.style.display = 'none'; continue; }
    if (el.style.display === 'none') { el.style.display = ''; el._measure = true; }
    if (el._measure) { el._w = el.offsetWidth; el._h = el.offsetHeight; el._measure = false; }
    items.push({ el, x: p[0], y: p[1], z: p[2], w: el._w, h: el._h, near: e.you });
  }
  // nearest tags keep their spot; the rest step upward until they stop overlapping
  items.sort((a, b) => (b.near - a.near) || a.z - b.z);
  const placed = [];
  for (const it of items) {
    let y = it.y;
    for (let n = 0; n < 10; n++) {
      const hit = placed.find((r) => Math.abs(r.x - it.x) < (r.w + it.w) / 2 + 4 && y > r.top - 3 && y - it.h < r.bottom + 3);
      if (!hit) break;
      y = hit.top - 4;
    }
    placed.push({ x: it.x, w: it.w, top: y - it.h, bottom: y });
    it.el.style.transform = `translate(${it.x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
    it.el.style.zIndex = String(1000 - Math.round(it.z * 10));
  }
  const sp = S.spot && S.spot.placeId === S.placeId ? project([S.spot.x, 0.25, S.spot.z], W, H) : null;
  spotEl.style.display = sp ? '' : 'none';
  if (sp) spotEl.style.transform = `translate(${sp[0].toFixed(1)}px, ${sp[1].toFixed(1)}px) translate(-50%, -100%)`;
}

// =====================================================================
//  Picking & selection
// =====================================================================
function rayDir(cx, cy) {
  const u = (cx / W) * 2 - 1, v = 1 - (cy / H) * 2;
  const asp = W / H;
  return V.norm([0, 1, 2].map((i) => C.F[i] + u * C.R[i] * C.tan * asp + v * C.U[i] * C.tan));
}
function groundAt(cx, cy) {
  const d = rayDir(cx, cy);
  if (d[1] >= -0.01) return null;
  const t = -C.pos[1] / d[1];
  const x = C.pos[0] + d[0] * t, z = C.pos[2] + d[2] * t;
  return Math.hypot(x, z - 0.4) < 14 ? [x, z] : null;
}
function pickAt(cx, cy) {
  const d = rayDir(cx, cy);
  let best = null, bt = Infinity;
  for (const e of S.ents.values()) {
    const h = e.pickH ?? (e.kind === 'person' ? (e.down ? 0.3 : 1.0) : e.kind === 'exit' ? 1.3 : 0.4);
    const c = [e.pos[0], (e.pos[1] || 0) + h, e.pos[2]];
    const r = e.pickR ?? (e.kind === 'person' ? 0.8 : e.kind === 'exit' ? 0.8 : e.tk === 'well' ? 1.1 : 0.55);
    const oc = V.sub(C.pos, c);
    const b = V.dot(oc, d), cc = V.dot(oc, oc) - r * r, disc = b * b - cc;
    if (disc < 0) continue;
    const t = -b - Math.sqrt(disc);
    if (t > 0 && t < bt) { bt = t; best = e; }
  }
  return best;
}

function selectEnt(id, openTray) {
  const e = S.ents.get(id);
  const target = !e ? id : e.kind === 'exit' ? e.placeId : e.you ? null : e.id;
  S.sel = target;
  S.form = null;
  for (const x of S.ents.values()) x.sel = x.kind === 'person' && x.id === target;
  if (openTray) setTray(true);
  renderTray();
  renderSayTo();
}

let drag = null;
canvas.addEventListener('pointerdown', (ev) => {
  drag = { x: ev.clientX, y: ev.clientY, moved: false };
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; canvas.classList.add('dragging'); }
  if (drag.moved) {
    cam.yaw -= dx * 0.006;
    cam.pitch = Math.max(0.06, Math.min(1.25, cam.pitch + dy * 0.004));
    drag.x = ev.clientX; drag.y = ev.clientY;
  }
});
canvas.addEventListener('pointerup', (ev) => {
  canvas.classList.remove('dragging');
  if (drag && !drag.moved) {
    const e = pickAt(ev.clientX, ev.clientY);
    if (e) { selectEnt(e.id, true); S.spot = null; }
    else {
      // clicking the ground marks "here" for typed commands
      S.sel = null;
      for (const x of S.ents.values()) x.sel = false;
      const g = groundAt(ev.clientX, ev.clientY);
      S.spot = g ? { x: g[0], z: g[1], placeId: S.placeId } : null;
      renderTray();
      renderSayTo();
    }
  }
  drag = null;
});
canvas.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  cam.dist = Math.max(5, Math.min(32, cam.dist * Math.pow(1.0015, ev.deltaY)));
}, { passive: false });

// =====================================================================
//  Events → log, captions, speech
// =====================================================================
function learnNames(st) {
  const put = (id, name) => { if (id && name) S.names.set(id, name); };
  put(st.you?.id, st.you?.name);
  put(st.here?.id, st.here?.name);
  for (const b of st.here?.breadcrumb || []) put(b.id, b.name);
  for (const e of st.present || []) put(e.id, e.name);
  for (const e of st.holding || []) put(e.id, e.name);
  for (const x of st.exits || []) put(x.to, x.name);
  for (const k of st.knows || []) put(k.who, k.name);
  for (const r of st.relations || []) put(r.with, r.name);
  for (const p of st.known_places || []) put(p.id, p.name);
  for (const a of st.affordances || []) put(a.target, a.target_name);
}

function summarize(p) {
  const bits = Object.entries(p || {})
    .filter(([k, v]) => v != null && typeof v !== 'object' && !['params'].includes(k))
    .slice(0, 4)
    .map(([k, v]) => `${k} ${typeof v === 'string' && S.names.has(v) ? nm(v) : v}`);
  return bits.length ? ` (${bits.join(', ')})` : '';
}

function fmtEvent(e) {
  const p = e.payload || {};
  const A = nm(e.actor), T = nm(e.target);
  switch (e.kind) {
    case 'say': return { line: `${A}${p.to ? ' → ' + nm(p.to) : ''}: “${p.text}”`, cls: 'say', speech: p.text, caption: `${A}: “${p.text}”` };
    case 'talked': return { line: `${A} talks with ${T}${p.text ? ': ' + p.text : ''}`, cls: 'say', speech: p.text, caption: `${A} talks with ${T}` };
    case 'act': return { line: `${A} · ${p.verb}${e.target ? ' ' + T : ''}`, cls: 'act', activity: `${p.verb}${e.target ? ' ' + T : ''}`, minor: true };
    case 'arrived': return { line: `${nm(p.who || e.actor)} arrives at ${nm(p.place || e.target)}`, cls: 'move', caption: `${nm(p.who || e.actor)} arrives` };
    case 'left': return { line: `${nm(p.entity)} leaves ${T}`, cls: 'minor', minor: true };
    case 'moved': return { line: `${T} → ${nm(p.to)}`, cls: 'minor', minor: true };
    case 'drank': return { line: `${A} drinks from ${T}${p.water != null ? ` (water ${p.water})` : ''}`, cls: 'water', caption: `${A} drinks from ${T}` };
    case 'read': return { line: `${A} reads ${T}`, cls: 'act', detail: p.text, caption: `${A} reads ${T}` };
    case 'searched': return { line: `${A} searches ${T}${p.found?.length ? ' and finds ' + p.found.map(nm).join(', ') : ''}`, cls: 'act', caption: `${A} searches ${T}` };
    default: {
      const text = typeof p.text === 'string' ? p.text : typeof p.result === 'string' ? p.result : null;
      const verb = (e.kind || 'event').replace(/_/g, ' ');
      const line = `${A} ${verb}${e.target && e.target !== e.actor ? ' ' + T : ''}${text ? ': ' + text : summarize(p)}`;
      return { line, cls: /attack|hit|wound|kill|down|dead|strike|miss|duel|threat/.test(e.kind) ? 'fight' : 'misc', caption: line, speech: null };
    }
  }
}

const logEl = $('#log');
function logLine(text, cls, n, detail) {
  const d = document.createElement('div');
  d.className = `ev ${cls || ''}`;
  if (n != null) d.dataset.seq = n;
  d.innerHTML = `${n != null ? `<span class="n">#${n}</span>` : ''}${esc(text)}${detail ? `<span class="detail">${esc(detail)}</span>` : ''}`;
  const stick = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 30;
  // keep the log in world order even when older events arrive late
  let before = null;
  if (n != null) {
    for (let c = logEl.lastElementChild; c; c = c.previousElementSibling) {
      if (c.dataset.seq == null || +c.dataset.seq < n) break;
      before = c;
    }
  }
  logEl.insertBefore(d, before);
  while (logEl.childElementCount > 400) logEl.firstChild.remove();
  if (stick) logEl.scrollTop = logEl.scrollHeight;
}

// bookkeeping the engine records but a player does not need to see
const QUIET = new Set(['opinion', 'patched', 'cursor', 'tick', 'scheduled', 'unscheduled', 'timer', 'remembered', 'intended']);

function ingestEvents(events, source) {
  const sorted = [...events].sort((a, b) => a.seq - b.seq);
  for (const e of sorted) {
    if (S.seen.has(e.seq)) continue;
    S.seen.add(e.seq);
    const f = fmtEvent(e);
    if (QUIET.has(e.kind)) { f.minor = true; f.cls = 'minor'; f.speech = null; }
    logLine(f.line, f.cls, e.seq, f.detail);
    const fresh = source !== 'backlog' && (!S.state || e.t >= S.state.t - 60);
    if (!fresh) continue;
    const real = 9000;
    if (!QUIET.has(e.kind)) Story.event(e);
    if (f.speech && e.actor) S.speech.set(e.actor, { text: f.speech, until: performance.now() + real });
    if ((e.kind === 'say' || e.kind === 'talked') && e.actor) {
      const other = e.payload?.to || (e.target && e.target !== e.actor ? e.target : null);
      if (other) {
        const until = performance.now() + real;
        S.faceAt.set(e.actor, { id: other, until });
        S.faceAt.set(other, { id: e.actor, until });
        if (e.actor === S.youId) S.lastTalk = other;
        else if (other === S.youId) S.lastTalk = e.actor;
      }
    }
    if (f.activity && e.actor) S.activity.set(e.actor, { text: f.activity, until: performance.now() + real });
    const mine = e.actor === S.youId && e.kind === 'act';
    if (!f.minor && !mine && f.caption) addCaption(f.caption, '');
  }
}

const capEl = $('#captions');
function addCaption(text, cls) {
  const c = { id: Math.random().toString(36).slice(2), text, cls, at: performance.now() };
  S.captions.push(c);
  if (S.captions.length > 4) S.captions.shift();
  renderCaptions();
  return c;
}
function resolveCaption(c, cls, text) {
  c.cls = cls;
  if (text) c.text = text;
  renderCaptions();
}
function renderCaptions() {
  const now = performance.now();
  capEl.innerHTML = S.captions
    .map((c, i) => `<div class="cap pill ${c.cls || ''} ${i < S.captions.length - 2 && now - c.at > 8000 ? 'old' : ''}" title="${esc(c.text)}">${esc(c.text)}</div>`)
    .join('');
}
setInterval(renderCaptions, 2000);

function meter(label, val, max, color) {

  return `<div class="meter"><div class="lbl"><i style="background:${color}"></i>${label}<b>${val ?? '–'}/${max ?? '–'}</b></div><div class="bar"><span style="width:${pct}%;background:${color}"></span></div></div>`;
}
function renderVitals() {

function renderLatency() {

// ---------- action tray
const FORM_VERBS = new Set(['talk', 'parley', 'give', 'show', 'check']);
function needsForm(a) {
  const keys = Object.keys(a.params || {});
  if (!keys.length) return false;
  return FORM_VERBS.has(a.verb) || (!a.ok && /say what|params/i.test(a.reason || ''));
}
function setTray(open) {
  $('#tray').classList.toggle('open', open);
  document.body.classList.toggle('tray-open', open);

}

function renderTray() {
  const st = S.state;
  if (!st || !$('#tray').classList.contains('open')) return;
  const sel = S.sel ?? null;

  const targets = [{ id: null, name: 'Yourself' }];
  for (const e of st.present || []) if (!(e.state && e.state.hidden)) targets.push({ id: e.id, name: e.name, sub: isPerson(e) ? '' : 'here' });
  for (const e of st.holding || []) targets.push({ id: e.id, name: e.name, sub: 'held' });
  const tHtml = targets.map((t) => `<button type="button" data-sel="${esc(t.id ?? '')}" class="${(t.id ?? null) === sel ? 'on' : ''}">${esc(t.name)}${t.sub ? ` <small>${t.sub}</small>` : ''}</button>`).join('');
  setHtml('#trayTargets', tHtml);

  const isExit = (st.exits || []).some((x) => x.to === sel);
  const affs = (st.affordances || []).filter((a) => (a.target ?? null) === sel);
  $('#verbsHead').textContent = sel ? `Actions · ${nm(sel)}` : 'Actions · yourself';
  const vHtml = affs.length
    ? affs.map((a, i) => {
        const form = needsForm(a);
        const enabled = a.ok || form;
        return `<button type="button" class="verb ${form ? 'form' : ''}" data-aff="${i}" ${enabled ? '' : 'disabled'} title="${esc(a.ok ? a.doc : a.reason || a.doc)}">${esc(a.verb)}</button>`;
      }).join('')
    : `<span class="why">Nothing to do with ${esc(nm(sel))} from here.</span>`;
  setHtml('#trayVerbs', vHtml);
  $('#trayVerbs')._affs = affs;
  const blocked = affs.filter((a) => !a.ok && !needsForm(a));
  setHtml('#trayWhy', blocked.length ? blocked.slice(0, 4).map((a) => `<b>${esc(a.verb)}</b>: ${esc(a.reason)}`).join('<br>') : '');

  const exits = st.exits || [];
  $('#trayExitsWrap').style.display = exits.length && !isExit ? '' : 'none';
  const xHtml = exits.map((x, i) => {
    const verbs = (st.affordances || []).filter((a) => a.target === x.to && a.ok);
    return `<div class="exitrow"><kbd>${i + 1}</kbd><span>${esc(x.name)}</span>${verbs.map((a) => `<button type="button" class="verb" data-exit="${esc(x.to)}" data-verb="${esc(a.verb)}" title="${esc(a.doc)}">${esc(a.verb)}</button>`).join('')}</div>`;
  }).join('');
  setHtml('#trayExits', xHtml);
}
function setHtml(sel, html) { const el = $(sel); if (el._html !== html) { el._html = html; el.innerHTML = html; } }

$('#trayTargets').addEventListener('click', (ev) => {

function renderForm() {
  const f = $('#trayForm');

$('#actionsBtn').addEventListener('click', () => setTray(!$('#tray').classList.contains('open')));

    describe: ['{me} took the measure of the place. {d}', '{me} stood still and let the place speak first. {d}'],
    read: [
      '{me} read it twice. Ink is only ink until someone bleeds to enforce it. *“{d}”*',

    ],
    watch: ['From the threshold, {me} watched {t} and learned what it would admit to. {d}', '{me} looked toward {t} without stepping through. {d}'],
    drink: [
      '{me} drank from {t}, and the water was a small, cool mercy. *Count every swallow,* {me} thought. *The Reach does.*',
      '{me} drank. The water rested on the tongue a moment before it was allowed to go, the way the old carriers taught.',
    ],
    fill: ["{me} filled {t} and felt its weight change: the most honest weight in the Reach.", 'The skin swelled under {me}’s hands. Here, that sound was wealth.'],
    go: ['{me} turned toward {t}. Behind, the place closed over the space where {me} had stood, as sand closes over a footprint.', '{me} set out for {t}, reading the ground ahead the way a scholar reads a contested text.'],
    creep: ['{me} took the broken step toward {t}: a pause, a shift, a pause. The sand heard nothing it could name.'],
    crawl: ['{me} dragged toward {t}, a hand-length at a time. The ground was hot, and indifferent.'],
    take: ['{me} took {t}. Ownership, in this country, was only a promise that someone would eventually test.'],
    drop: ['{me} set {t} down. Even that small act was watched.'],
    give: ['{me} held out {i} to {t}. *Nothing given in the Reach is ever only a gift.*'],
    show: ['{me} showed {i} to {t} and watched the face, not the object.'],
    talk: ['{me} spoke with {t}{a}, weighing each word as though it cost water.', '{me} drew {t} aside{a}. *Listen for what is not said,* {me} thought.'],
    parley: ['{me} named terms to {t}: {o}. The offer hung between them like heat over the glass.'],
    attack: ['Steel moved. {me} struck at {t}{s}.', '{me} closed on {t}, blade first{s}. *Commit, or do not begin.*'],
    kill: ['{me} finished it. The sand took what it was given, without comment.'],
    threaten: ['{me} let {t} see the blade, and the promise in it.'],
    challenge: ['{me} called {t} out. A circle opened in the sand that no one else would enter.'],
    yield: ['{me} yielded to {t}. *Pride is a luxury of the well-watered.*'],
    brace: ['{me} settled into a guard, weight low, the mind emptied of everything but the next breath.'],
    follow: ['{me} fell in behind {t}, close enough to hear the breathing.'],
    stay: ['{me} stayed. Sometimes the strongest move is to remain exactly where you are.'],
    search: ['{me} went through what {t} carried, quick and thorough. Dignity is another thing the desert takes.'],
    toggle: ['{me} thumbed {t}. The change in its hum was felt more than heard.'],
    check: ['{me} gathered every sense toward the task. {d}'],
    say: ['“{q},” {me} said{to}.', '“{q},” said {me}{to}, and waited to see what it would cost.', '{me} spoke{to}: “{q}”'],
    sayOther: ['“{q},” {a} said{to}.', '“{q},” {a} said{to}. The words came out dry and measured.', '{a} spoke{to}: “{q}”'],
    arrivedOther: ['{a} came in out of the glare, and the place rearranged itself around the newcomer.', '{a} arrived, shaking sand from their clothes. Every eye made its private accounting.'],
    drankOther: ['{a} drank from {t}, and every eye followed the water.'],
    fight: ['Steel moved between {a} and {t}, quick as a lie.', 'Violence, brief and graceless. {a} and {t} parted with less than they began with.'],
    down: ['{a} went down onto the sand, and the sand did not care.'],
    dead: ['{a} died. Somewhere, a measure of water was reckoned against the living.'],
  };

  const pick = (arr, seed) => arr[hashStr(`${seed}|${salt++}`) % arr.length];
  const fill = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (m, k) => (v[k] ?? '')).replace(/\s+/g, ' ').replace(/\s([.,:;])/g, '$1').trim();
  const me = () => firstName();
  const list = (a) => (a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`);
  const unquote = (s) => String(s || '').trim().replace(/^['"“‘]+|['"”’]+$/g, '').trim();
  const thought = (seed, chance = 0.3) => (Math.random() < chance ? ` *${pick(THOUGHTS, seed)}*` : '');

  function segs(s) {
    const out = [];
    const re = /\*([^*]+)\*/g;
    let last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) out.push({ t: s.slice(last, m.index), em: false });
      out.push({ t: m[1], em: true });
      last = re.lastIndex;
    }
    if (last < s.length) out.push({ t: s.slice(last), em: false });
    return out;
  }
  function render(it) {
    let left = it.shown, html = '';
    for (const sg of it.segs) {
      if (left <= 0) break;
      const part = sg.t.slice(0, left);
      left -= part.length;
      html += sg.em ? `<em>${esc(part)}</em>` : esc(part);
    }
    if (it.shown < it.total) html += '<span class="caret">▍</span>';
    it.node.innerHTML = html;
  }
  function tick() {
    const pending = paras.filter((p) => p.shown < p.total);
    if (!pending.length) { clearInterval(timer); timer = 0; return; }
    const it = pending[0];
    // types at ~190 characters a second, faster when the story falls behind
    it.shown = Math.min(it.total, it.shown + (pending.length > 1 ? 10 : 3));
    render(it);
  }
  function push(text, cls) {
    if (!on || !text) return;
    const node = document.createElement('p');
    node.className = cls || '';
    const sg = segs(text);
    const it = { node, segs: sg, total: sg.reduce((n, x) => n + x.t.length, 0), shown: 0 };
    paras.push(it);
    el.appendChild(node);
    while (paras.length > 6) paras.shift().node.remove();
    paras.forEach((p, i) => { p.node.style.opacity = String(Math.max(0.3, 1 - (paras.length - 1 - i) * 0.16)); });
    el.classList.add('show');
    lastAt = performance.now();
    render(it);
    if (!timer) timer = setInterval(tick, 16);
  }
  el.addEventListener('click', () => { for (const p of paras) { p.shown = p.total; render(p); } });
  setInterval(() => {
    if (performance.now() - lastAt > 30000 && !paras.some((p) => p.shown < p.total)) el.classList.remove('show');
  }, 2000);

  return {
    setOn(v) { on = v; if (!v) el.classList.remove('show'); else if (paras.length) el.classList.add('show'); },
    get on() { return on; },
    arrive(st) {
      const kind = pickRecipe(st.here);
      const [q, src] = pick([...(EPI[kind] || []), ...EPI.any], st.here.id);
      push(`*“${q}”*\n— ${src}`, 'epi');
      const a = st.ambient || {};
      const who = (st.present || []).filter((e) => isPerson(e) && !(e.state && e.state.hidden) && e.id !== S.youId).map((e) => e.name);
      let s = `${st.here.name}. ${st.here.state?.description || ''}`;
      if (a.light || a.weather) s += ` The light was ${a.light || 'hard'}; ${a.weather || 'the air was still'}.`;
      if (who.length) s += ` ${list(who)} ${who.length > 1 ? 'were' : 'was'} already there.`;
      push(fill(s, {}) + thought(st.here.id, 0.5));
    },
    walk(ref) { push(fill(pick(T.walk, ref.name), { me: me(), t: ref.name }) + thought(ref.name, 0.25)); },
    look(ref, d) { push(fill(pick(T.look, ref.name), { me: me(), t: ref.name, d })); },
    describe(st) {
      const who = (st.present || []).filter((e) => !(e.state && e.state.hidden)).map((e) => e.name);
      const d = `${st.here.name}. ${st.here.state?.description || ''}${who.length ? ` Here: ${list(who)}.` : ''}`;
      push(fill(pick(T.describe, st.here.id), { me: me(), d }) + thought(st.here.id, 0.4));
    },
    yourSpeech(text, to) {
      if (/^\*.+\*$/.test(text.trim())) { push(text.trim().slice(1, -1).replace(/([^.!?])$/, '$1.')); return; }
      push(fill(pick(T.say, text), { me: me(), q: unquote(text).replace(/[.,]$/, ''), to: to ? ` to ${nm(to)}` : '' }));
    },
    act(verb, target, params, r) {
      const pool = T[verb];
      const engine = r ? ((r.logs && r.logs.join(' ')) || (typeof r.result === 'string' ? r.result : '')) : '';
      if (!pool) { if (engine) push(engine); return; }
      push(fill(pick(pool, verb + target), {
        me: me(), t: target ? nm(target) : '', d: engine,
        i: params?.item ? nm(params.item) : 'it',
        a: params?.about ? ` about ${params.about}` : '',
        o: params?.offer || '',
        s: params?.slow ? ', the slow blade sliding for the gap in the ward' : '',
      }));
    },
    event(e) {
      const p = e.payload || {};
      // the world's own scene lines (a crawler at dawn, the bearer at dusk) are already prose
      if (e.kind === 'scene' && p.text) return push(String(p.text));
      if (e.actor === S.youId) return; // your own deeds are told as you do them
      const a = nm(e.actor), t = nm(e.target);
      const toName = (id) => (id === S.youId ? me() : nm(id));
      if (e.kind === 'say' && p.text) {
        const raw = String(p.text).trim();
        const to = p.to ? ` to ${toName(p.to)}` : '';
        // engine lines that already mix prose and quotes ("Hollis smiles… 'Guild business.'") stand as written
        if (/['“"][^'”"]{3,}['”"]/.test(raw) && !/^['“"]/.test(raw)) return push(raw);
        if (/["“”]/.test(unquote(raw))) return push(`${a} spoke${to}. ${raw.replace(/^'|'$/g, '')}`);
        return push(fill(pick(T.sayOther, e.seq), { a, q: unquote(raw).replace(/[.,]$/, ''), to }) + (p.to === S.youId ? thought(e.seq, 0.35) : ''));
      }
      if (e.kind === 'arrived') { const who = p.who || e.actor; if (who !== S.youId) push(fill(pick(T.arrivedOther, e.seq), { a: nm(who) })); return; }
      if (e.kind === 'drank') return push(fill(pick(T.drankOther, e.seq), { a, t }));
      if (/dead|died|killed/.test(e.kind)) return push(fill(pick(T.dead, e.seq), { a: e.target && e.target !== e.actor ? t : a }));
      if (/down|fell|collapsed/.test(e.kind)) return push(fill(pick(T.down, e.seq), { a: e.target && e.target !== e.actor ? t : a }));
      if (/attack|hit|strike|struck|wound|duel/.test(e.kind) && e.target && e.target !== e.actor) return push(fill(pick(T.fight, e.seq), { a, t }));
    },
  };
})();

// =====================================================================
//  Network: SSE in, actions out
// =====================================================================
async function api(tool, args) {
  try {
    const r = await fetch('/api/' + tool, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
    return await r.json();
  } catch (e) {
    return { error: e.message };
  }
}

function reasonOf(out) {
  const r = out?.result;
  if (out?.error) return String(out.error);
  if (r && r.ok === false) return r.reason || r.error || (typeof r.result === 'string' ? r.result : 'refused');
  return null;
}

async function doVerb(verb, target, params) {
  const label = `${verb}${target ? ' ' + nm(target) : ''}`;
  const cap = addCaption(`${nm(S.youId)} › ${label}`, 'pending');
  if (S.youId) S.activity.set(S.youId, { text: `${label}…`, until: performance.now() + 30000 });
  const t0 = performance.now();
  const args = { verb };
  if (target) args.target = target;
  if (params && Object.keys(params).length) args.params = params;
  const out = await api('act', args);
  S.lat.act = Math.round(performance.now() - t0);
  const why = reasonOf(out);
  if (why) {
    resolveCaption(cap, 'fail', `${label}: ${why}`);
    logLine(`${label}: ${why}`, 'fail');
    S.activity.delete(S.youId);
    toast(why);
    return null;
  }
  const r = out.result || {};
  resolveCaption(cap, '', `${nm(S.youId)} › ${label}`);
  if (Array.isArray(r.events)) ingestEvents(r.events, 'act');
  const said = new Set();
  for (const l of r.logs || []) { said.add(l); logLine(l, 'narr'); }
  if (typeof r.result === 'string' && !said.has(r.result)) logLine(r.result, 'narr');
  const secs = r.duration > 0 ? r.duration / (S.rate || 1) : 0;
  S.activity.set(S.youId, { text: secs > 0.5 ? `${label} · ${Math.ceil(secs)}s` : label, until: performance.now() + Math.max(4000, secs * 1000) });
  Story.act(verb, target, params, r);
  return r;
}

async function doSay(text, to) {
  if (S.youId) S.speech.set(S.youId, { text, until: performance.now() + 9000 });
  Story.yourSpeech(text, to);
  if (to) { S.faceAt.set(S.youId, { id: to, until: performance.now() + 9000 }); S.lastTalk = to; }
  const t0 = performance.now();
  const out = await api('say', to ? { text, to } : { text });
  S.lat.act = Math.round(performance.now() - t0);
  const why = reasonOf(out);
  if (why) { toast(why); logLine(`say: ${why}`, 'fail'); S.speech.delete(S.youId); return false; }
  if (Array.isArray(out.result?.events)) ingestEvents(out.result.events, 'act');
  return true;
}

// =====================================================================
//  Words → references: names, kinds of thing, and "here / it / them"
// =====================================================================
const STOP = new Set(['the', 'a', 'an', 'of', 'to', 'at', 'on', 'in', 'with', 'by', 'into', 'from', 'my', 'some', 'his', 'her', 'their', 'your', 'our']);
const DEIX = new Set(['here', 'there', 'this', 'that', 'it', 'thing', 'them', 'him', 'her', 'one', 'spot', 'over', 'place', 'stuff', 'object', 'they', 'those', 'these', 'yonder', 'way']);
const PERSON_PRON = new Set(['them', 'him', 'her', 'they']);
const KIND_WORDS = {
  well: ['water', 'well', 'cistern', 'cask', 'tank', 'source', 'spring', 'trough', 'basin'],
  letter: ['letter', 'notice', 'note', 'writ', 'sign', 'paper', 'scroll', 'post', 'board', 'message', 'tally', 'ledger'],
  blade: ['blade', 'sword', 'knife', 'weapon', 'dagger', 'steel'],
  skin: ['skin', 'waterskin', 'flask', 'bottle', 'canteen', 'bag'],
  ward: ['ward', 'belt', 'shield', 'plate', 'device'],
};
const normT = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9'\s]+/g, ' ').replace(/\s+/g, ' ').trim();
const wordsOf = (s) => normT(s).split(' ').filter(Boolean);
const firstName = () => String(nm(S.youId) || 'You').split(/\s+/)[0];

function nameScore(name, phrase) {
  const pw = wordsOf(phrase).filter((w) => !STOP.has(w));
  if (!pw.length) return 0;
  const nw = wordsOf(name).map((x) => x.replace(/'s$/, ''));
  if (nw.join(' ') === pw.join(' ')) return 5;
  let hits = 0;
  for (const w of pw) {
    const ww = w.replace(/'s$/, '');
    if (nw.some((x) => x.startsWith(ww) || (ww.length > 3 && (ww.startsWith(x) && x.length > 3 || x.includes(ww))))) hits++;
    else return 0;
  }
  return 1 + hits / nw.length + (nw.find((x) => !STOP.has(x))?.startsWith(pw[0]) ? 0.5 : 0);
}

function refCandidates() {
  const st = S.state, out = [];
  for (const e of st.present || []) if (!(e.state && e.state.hidden)) out.push({ id: e.id, name: e.name, kind: isPerson(e) ? 'person' : 'thing', ent: e });
  for (const e of st.holding || []) out.push({ id: e.id, name: e.name, kind: 'held', ent: e });
  for (const x of st.exits || []) out.push({ id: x.to, name: x.name, kind: 'exit' });
  for (const p of st.known_places || []) {
    if (p.id !== st.here.id && !(st.exits || []).some((x) => x.to === p.id)) out.push({ id: p.id, name: p.name, kind: 'place' });
  }
  return out;
}

function scoreRef(c, phrase) {
  const sc = nameScore(c.name, phrase);
  if (sc) return sc + (c.kind === 'held' ? 0.05 : 0);
  const pw = wordsOf(phrase).filter((w) => !STOP.has(w) && !DEIX.has(w));
  if (!pw.length || !c.ent) return 0;
  if (c.kind === 'thing' || c.kind === 'held') {
    const kw = KIND_WORDS[thingKind(c.ent)] || [];
    if (pw.every((w) => kw.includes(w) || kw.includes(w.replace(/s$/, '')))) return 1.2;
  }
  const s = c.ent.state || {};
  const desc = wordsOf([s.description, s.role, s.template].filter(Boolean).join(' ')).map((x) => x.replace(/'s$/, ''));
  if (pw.every((w) => desc.some((x) => x.startsWith(w)))) return 0.9;
  return 0;
}

// want: list of kinds that fit (person, thing, held, exit, place, spot) or null for any
function resolveRef(phrase, want, ctx) {
  const raw = wordsOf(phrase);
  const content = raw.filter((w) => !STOP.has(w) && !DEIX.has(w));
  const cands = refCandidates();
  const fits = (c) => !want || want.includes(c.kind);
  if (content.length) {
    let best = null, bs = 0;
    for (const c of cands) { if (!fits(c)) continue; const s = scoreRef(c, phrase); if (s > bs) { bs = s; best = c; } }
    return best;
  }
  const spotRef = () => ({ kind: 'spot', id: null, name: 'that spot', pt: [S.spot.x, S.spot.z] });
  const spotHere = S.spot && S.spot.placeId === S.placeId;
  const selEnt = S.sel ? cands.find((c) => c.id === S.sel) : null;
  if (raw.some((w) => PERSON_PRON.has(w)) || (want && want.length === 1 && want[0] === 'person')) {
    const lt = S.lastTalk && cands.find((c) => c.id === S.lastTalk);
    const pick = [selEnt && selEnt.kind === 'person' ? selEnt : null, ctx.lastPerson, lt].find((c) => c && fits(c));
    if (pick) return pick;
    const people = cands.filter((c) => c.kind === 'person' && c.id !== S.youId);
    return people.length === 1 && fits(people[0]) ? people[0] : null;
  }
  if ((raw.includes('here') || raw.includes('there') || raw.includes('spot')) && spotHere && fits({ kind: 'spot' })) return spotRef();
  if (selEnt && fits(selEnt)) return selEnt;
  if (ctx.last && fits(ctx.last)) return ctx.last;
  if (spotHere) {
    // "the thing" with no selection: whatever sits nearest the clicked spot
    let best = null, bd = Infinity;
    for (const e of S.ents.values()) {
      if (e.kind !== 'thing') continue;
      const c = cands.find((x) => x.id === e.id);
      if (!c || !fits(c)) continue;
      const d = Math.hypot(e.pos[0] - S.spot.x, e.pos[2] - S.spot.z);
      if (d < bd) { bd = d; best = c; }
    }
    if (best && bd < 4) return best;
    if (fits({ kind: 'spot' })) return spotRef();
  }
  return null;
}

// Longest leading phrase that names something: "ossa two shards" → Ossa + "two shards"
function leadingRef(phrase, want, ctx) {
  const w = phrase.split(' ').filter(Boolean);
  for (let n = w.length; n >= 1; n--) {
    const r = resolveRef(w.slice(0, n).join(' '), want, ctx);
    if (r) return { ref: r, rest: w.slice(n).join(' ') };
  }
  return { ref: null, rest: phrase };
}

const LEMMA = {};
const lemma = (verb, list) => list.split(' ').forEach((f) => (LEMMA[f] = verb));
lemma('go', 'go goes going went walk walks walking head heads move moves run runs step steps travel travels return returns enter enters wander wanders stroll strolls approach approaches come comes leave leaves hurry hurries cross crosses');
lemma('creep', 'creep creeps sneak sneaks tiptoe tiptoes slip slips skulk prowl');
lemma('crawl', 'crawl crawls drag drags');
lemma('look', 'check checks look looks examine examines inspect inspects study studies observe observes peer peers eye eyes scan scans glance glances investigate investigates');
lemma('read', 'read reads peruse');
lemma('watch', 'watch watches scout scouts spy');
lemma('drink', 'drink drinks sip sips gulp gulps swig swigs quench');
lemma('fill', 'fill fills refill refills top');
lemma('take', 'take takes grab grabs pick picks get gets collect collects snatch pocket');
lemma('drop', 'drop drops put puts set sets place discard');
lemma('give', 'give gives hand hands pass passes');
lemma('show', 'show shows present presents flash');
lemma('talk', 'talk talks speak speaks chat chats ask asks tell tells discuss discusses question confer');
lemma('say', 'say says shout shouts whisper whispers yell yells mutter mutters reply replies answer answers call calls announce declare murmur exclaim');
lemma('attack', 'attack attacks strike strikes stab stabs hit hits slash slashes cut cuts swing lunge punch charge');
lemma('kill', 'kill kills finish slay');
lemma('threaten', 'threaten threatens intimidate menace');
lemma('challenge', 'challenge challenges duel');
